const strucToTxt=e=>e.map(l=>`${l.material}:${l.micras}:${l.densidad}:${l.paso}`).join('|');
const txtToStruc=s=>String(s).split('|').filter(Boolean).map(x=>{const [material,micras,densidad,paso]=x.split(':'); return {material,micras:+micras,densidad:+densidad,paso:+paso};});
function exportRows(ent){
  if(ent==='velocidades'){ const o=DB.machines.map(m=>({machine:m.id,velocidad:m.velocidad,prod:'',seq:''}));
    DB.routeSteps.forEach(s=>Object.entries(s.velocidades||{}).forEach(([m,v])=>o.push({machine:m,velocidad:v,prod:s.prod,seq:s.seq}))); return o; }
  const sc=SCHEMA[ent]; return DB[ent].map(r=>{ const o={}; sc.f.forEach(k=>{ let v=r[k]; if(k==='estructura') v=strucToTxt(v); else if(Array.isArray(v)) v=v.join('|'); o[k]=v??''; }); return o; });
}
function toCSV(ent){ const sc=SCHEMA[ent], rows=exportRows(ent); const q=v=>{ const s=String(v??''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return '\ufeff'+[sc.f.join(';'),...rows.map(r=>sc.f.map(k=>q(typeof r[k]==='number'?String(r[k]).replace('.',','):r[k])).join(';'))].join('\n'); }
function download(name,text,type='text/csv'){ const b=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function parseCSV(text){ text=text.replace(/^\ufeff/,''); const first=text.split(/\r?\n/)[0]; const d=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===d){row.push(cur);cur='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur!==''||row.length){row.push(cur); rows.push(row);}
  const h=rows.shift().map(x=>x.trim()); return {rows:rows.filter(r=>r.some(c=>c!=='')).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??'']))),dec:d===';'?',':'.'}; }
function normRow(ent,raw,dec){ const sc=SCHEMA[ent], o={}; const keys=Object.keys(raw); 
  sc.f.forEach(k=>{ const rk=keys.find(x=>x.trim().toLowerCase()===k.toLowerCase()); let v=rk!=null?raw[rk]:''; 
    if(k==='estructura'){ o[k]=txtToStruc(v); return; }
    if(sc.list&&sc.list.includes(k)){ o[k]=String(v).split('|').map(s=>s.trim()).filter(Boolean); return; }
    if(sc.txt.includes(k)){ o[k]=String(v).trim(); return; }
    if(k==='activo'){ o[k]=!/^(0|no|false|falso)$/i.test(String(v)); return; }
    if(v===''||v==null){ o[k]=null; return; }
    if(typeof v==='string'){ v=v.trim(); if(dec===',') v=v.replace(/\./g,'').replace(',','.'); }
    o[k]=+v; });
  return o; }
async function importFile(ent,file){
  let rows, dec='.';
  if(/\.csv$|\.txt$/i.test(file.name)){ const r=parseCSV(await file.text()); rows=r.rows; dec=r.dec; }
  else { if(!window.XLSX) throw new Error('Para leer Excel se necesita conexión (SheetJS). Guarda el archivo como CSV o conéctate.'); const wb=XLSX.read(await file.arrayBuffer()); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}); }
  if(!rows.length) throw new Error('El archivo no tiene filas.');
  const N=rows.map(r=>normRow(ent,r,dec));
  if(ent==='velocidades'){ let n=0; N.forEach(r=>{ if(!r.machine||!(r.velocidad>0)) return;
      if(r.prod){ const st=DB.routeSteps.find(s=>s.prod===r.prod&&s.seq===+r.seq); if(st){ st.velocidades=st.velocidades||{}; st.velocidades[r.machine]=r.velocidad; n++; } }
      else { const m=DB.machines.find(x=>x.id===r.machine); if(m){ m.velocidad=r.velocidad; n++; } } }); return `${n} velocidades actualizadas.`; }
  if(ent==='products'){ N.forEach(p=>{ if(!p.estructura.length) p.estructura=[{material:'Film',micras:20,densidad:0.92,paso:1}]; }); }
  if(ent==='routeSteps'){ N.forEach(s=>{ s.velocidades={}; }); const prods=new Set(N.map(s=>s.prod)); DB.routeSteps=DB.routeSteps.filter(s=>!prods.has(s.prod)).concat(N); return `${N.length} pasos importados para ${prods.size} producto(s); sus rutas anteriores se reemplazaron.`; }
  if(ent==='demand'){ const keys=new Set(N.map(r=>r.mes+'|'+r.tipo)); DB.demand=DB.demand.filter(r=>!keys.has(r.mes+'|'+r.tipo)).concat(N); return `${N.length} filas de demanda; se reemplazaron los meses y tipos incluidos en el archivo.`; }
  if(ent==='production'){ const keys=new Set(N.map(r=>r.mes)); DB.production=DB.production.filter(r=>!keys.has(r.mes)).concat(N); return `${N.length} filas de producción importadas.`; }
  if(ent==='downtime'){ const keys=new Set(N.map(r=>r.machine+'|'+r.mes)); DB.downtime=DB.downtime.filter(r=>!keys.has(r.machine+'|'+r.mes)).concat(N); return `${N.length} filas de paros importadas.`; }
  const key=SCHEMA[ent].key; let a=0,u=0;
  N.forEach(r=>{ const i=DB[ent].findIndex(x=>x[key]===r[key]); if(i>=0){ DB[ent][i]={...DB[ent][i],...r}; u++; } else { if(ent==='machines'){ r.estado=r.estado||'Activa'; } DB[ent].push(r); a++; } });
  if(ent==='products') N.forEach(p=>{ if(!DB.routes.some(r=>r.prod===p.id)) DB.routes.push({prod:p.id,version:1,activa:true}); });
  return `${u} registros actualizados y ${a} nuevos en ${SCHEMA[ent].t}.`;
}
function vDatos(){
  const cards=Object.entries(SCHEMA).map(([k,s])=>`<div class="dcard"><div><b>${s.t}</b><small>${s.virtual?'actualiza velocidades de máquina o por paso':(DB[k]?.length??0)+' registros'}</small></div>
    <div class="dact"><label class="btn">Importar<input type="file" accept=".csv,.xlsx,.xls,.txt" data-imp="${k}" hidden></label><button class="btn ghost" data-act="tpl" data-e="${k}">Plantilla CSV</button></div>
    <div class="cols">${s.f.join(' · ')}</div></div>`).join('');
  return head('Datos','Fuentes del modelo. Cada tabla se puede reemplazar por datos reales desde Excel o CSV sin cambiar el motor.')+
  (UI.importMsg?`<div class="banner">${esc(UI.importMsg)}</div>`:'')+`
  <div class="dgrid">${cards}</div>
  <div class="card"><h3>Respaldo completo</h3><div class="filters">
    <button class="btn" data-act="expJSON">Exportar modelo (JSON)</button><label class="btn">Importar modelo (JSON)<input type="file" accept=".json" data-impjson hidden></label>
    <button class="btn ghost" data-act="resetDemo">Restablecer datos demo</button></div>
    <p class="note">La plantilla CSV descarga los datos actuales con el formato esperado (separador ";", decimales con coma). Listas con "|", por ejemplo máquinas compatibles "I01|I03". Estructura: "material:micras:densidad:paso|…". Demanda: tipo = Confirmado, Forecast, Presupuesto o Histórico; mes = AAAA-MM. Los datos se guardan en este navegador.</p></div>`;
}

/* ---------- 11. Configuración ---------- */
function vConfig(){
  const c=CFG, cf=(k,l,v,t='num',n='')=>`<label class="fl"><span>${l}</span>${t==='pct'?`<input type="number" step="any" data-cfg="${k}:pct" value="${+(v*100).toFixed(2)}"> <small>%</small>`:`<input type="${t==='num'?'number':'text'}" step="any" data-cfg="${k}:${t}" value="${esc(v)}">`} <small>${n}</small></label>`;
  const calRows=DB.calendar.map(x=>{ const k=`calendar:${x.proc}`; return `<tr><td>${pName(x.proc)}</td><td>${inp(k+':turnos',x.turnos,'num',56)}</td><td>${inp(k+':horasTurno',x.horasTurno,'num',56)}</td><td>${inp(k+':diasMes',x.diasMes,'num',56)}</td><td class="num">${fmt(x.turnos*x.horasTurno*x.diasMes)}</td><td>${inp(k+':setupH',x.setupH,'num',60)}</td><td>${inp(k+':cambioRolloMin',x.cambioRolloMin,'num',60)}</td><td>${inp(k+':maxHorasExtra',x.maxHorasExtra,'num',60)}</td></tr>`; }).join('');
  const prRows=DB.processes.map(p=>{ const k=`processes:${p.id}`; return `<tr><td><b>${p.id}</b></td><td>${inp(k+':nombre',p.nombre,'text',150)}</td><td><select class="ed" data-edit="${k}:unidad:text">${opts([['m','Metros (m/min)'],['golpe','Golpes (golpes/min)'],['m2','m²'],['und','Unidades']],p.unidad)}</select></td><td>${inp(k+':tipo',p.tipo,'text',120)}</td><td><select class="ed" data-edit="${k}:activo:bool">${opts([['true','Activo'],['false','Inactivo']],String(p.activo))}</select></td></tr>`; }).join('');
  return head('Configuración','Parámetros y reglas del modelo')+`
  <div class="grid g2">
    <div class="card"><h3>Semáforo de utilización</h3>
      ${cf('sem.amarillo','Amarillo desde',c.sem.amarillo,'pct')}${cf('sem.naranja','Naranja desde',c.sem.naranja,'pct')}${cf('sem.rojo','Rojo por encima de',c.sem.rojo,'pct')}
      <div class="semdemo">${pill('green','< '+pct(c.sem.amarillo,0))}${pill('yellow',pct(c.sem.amarillo,0)+'–'+pct(c.sem.naranja,0))}${pill('orange',pct(c.sem.naranja,0)+'–'+pct(c.sem.rojo,0))}${pill('red','> '+pct(c.sem.rojo,0))}</div>
      <h3>Reglas de cálculo</h3>
      <label class="fl"><span>Fuente de eficiencia</span><select data-cfg="effSource:text">${opts([['ruta','Paso de ruta (producto-proceso)'],['maquina','Máquina'],['combinada','Máquina × ruta']],c.effSource)}</select> <small>pendiente de confirmar</small></label>
      <label class="fl"><span>Asignación de máquinas</span><select data-cfg="politica:text">${opts([['balanceo','Balanceo de carga'],['preferente','Primera máquina compatible']],c.politica)}</select></label>
      <label class="fl"><span>Demanda que carga capacidad</span><span>${['Confirmado','Forecast','Presupuesto'].map(tp=>`<label><input type="checkbox" data-tipo="${tp}" ${c.tiposDemanda.includes(tp)?'checked':''}> ${tp}</label>`).join(' ')}</span></label>
      ${cf('diamCore','Diámetro del core',c.diamCore,'num','mm')}${cf('chunks','Granularidad del balanceo',c.chunks,'num','fracciones por tarea')}
      ${cf('minDisponibilidad','Alerta de baja disponibilidad bajo',c.minDisponibilidad,'pct')}
    </div>
    <div class="card"><h3>Horizonte</h3>
      ${cf('fechaCorte','Fecha de corte (hoy del modelo)',c.fechaCorte,'text','AAAA-MM-DD')}${cf('mesInicio','Primer mes del horizonte',c.mesInicio,'text','AAAA-MM')}${cf('horizonte','Meses del horizonte',c.horizonte,'num')}
      <h3>Parámetros financieros (COP)</h3>
      ${cf('tasaDescuento','Tasa de descuento',c.tasaDescuento,'pct','demo · por confirmar')}${cf('recargoHoraExtra','Recargo promedio hora extra',c.recargoHoraExtra,'pct','demo · por confirmar')}
      <h3>Supuestos vigentes</h3>
      <ul class="sup"><li>La demanda se expresa en kg de producto terminado y se convierte a metros con gramaje y ancho del web.</li><li>Las mermas se acumulan hacia atrás: cada paso procesa la cantidad necesaria para cubrir el rendimiento de los pasos siguientes.</li><li>Después del refile de impreso los metros se multiplican por el número de pistas.</li><li>Setups = número de cambios de referencia (demanda ÷ lote promedio) × tiempo de cambio.</li><li>Cambios de rollo = metros ÷ metros por rollo (diámetro máximo, core y calibre acumulado).</li><li>Las máquinas compartidas usan el calendario de su primer proceso.</li><li>No hay tercerización ni tiempos de tránsito entre procesos.</li><li>Planeación de capacidad agregada por mes, no programación secuencial.</li></ul>
    </div>
  </div>
  <div class="card"><h3>Calendario y tiempos estándar por proceso</h3><div class="tw"><table class="t ed-t"><thead><tr><th>Proceso</th><th>Turnos</th><th>Horas/turno</th><th>Días/mes</th><th class="num">H teóricas/máq.</th><th>Tiempo de cambio (h)</th><th>Cambio de rollo (min)</th><th>Máx. horas extra/mes</th></tr></thead><tbody>${calRows}</tbody></table></div></div>
  <div class="card"><h3>Procesos</h3><div class="tw"><table class="t ed-t"><thead><tr><th>Código</th><th>Nombre</th><th>Unidad de capacidad</th><th>Tipo</th><th>Estado</th></tr></thead><tbody>${prRows}</tbody></table></div>
    <div class="filters"><input type="text" id="newProcId" placeholder="Código" style="width:80px"><input type="text" id="newProcName" placeholder="Nombre"><button class="btn" data-act="addProc">Agregar proceso</button></div></div>`;
}

/* =====================================================================
   6. NAVEGACIÓN, RENDER Y EVENTOS
   ===================================================================== */
const NAV=[['resumen','Resumen ejecutivo',vResumen],['capacidad','Capacidad',vCapacidad],['demanda','Demanda',vDemanda],['cuellos','Cuellos de botella',vCuellos],
  ['maquinas','Máquinas',vMaquinas],['productos','Productos / Mix',vProductos],['rutas','Rutas productivas',vRutas],['simulador','Simulador',vSimulador],
  ['capex','CAPEX',vCapex],['datos','Datos',vDatos],['config','Configuración',vConfig]];
function render(keepScroll){
  const y=window.scrollY; AFTER=[];
  $('#nav').innerHTML=NAV.map(([k,t],i)=>`<a class="${UI.view===k?'on':''}" data-act="go" data-v="${k}"><span class="n">${i+1}</span>${t}</a>`).join('');
  $('#scnSel').innerHTML=opts(SCN.map(s=>[s.id,s.nombre]),UI.scnActivo);
  $('#scnFlag').className=UI.scnActivo==='base'?'flag':'flag on';
  let html; try{ html=NAV.find(n=>n[0]===UI.view)[2](); }catch(e){ console.error(e); html=`<div class="card"><div class="status st-red">Error al calcular esta vista</div><p class="msg">${esc(e.message)}</p><p class="note">Revisa los últimos datos modificados o restablece los datos demo en la sección Datos.</p></div>`; }
  $('#view').innerHTML=html;
  AFTER.forEach(f=>{ try{f();}catch(e){console.error(e);} });
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}
function setPath(obj,path,val){ const ks=path.split('.'); let o=obj; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks[ks.length-1]]=val; }
function findRow(coll,key){
  if(coll==='routeSteps'){ const [p,s]=key.split('#'); return DB.routeSteps.find(x=>x.prod===p&&String(x.seq)===s); }
  if(coll==='calendar') return DB.calendar.find(x=>x.proc===key);
  if(coll==='margins'){ let r=DB.margins.find(x=>x.prod===key); if(!r){ r={prod:key,margenKg:0,precioKg:0}; DB.margins.push(r);} return r; }
  return (DB[coll]||[]).find(x=>x.id===key);
}
function changed(){ R.capex=null; recalc(); render(true); }

document.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset;
  if(d.edit){ const [coll,key,field,type]=d.edit.split(':'); const row=findRow(coll,key); if(!row) return;
    let v=t.value;
    if(type==='num') v=v===''?null:+v; else if(type==='pct') v=v===''?null:+v/100; else if(type==='list') v=v.split('|').map(s=>s.trim()).filter(Boolean); else if(type==='bool') v=v==='true';
    if(coll==='routeSteps'&&field==='proc'){ row.maquinas=DB.machines.filter(m=>m.procesos.includes(v)).map(m=>m.id); }
    row[field]=v; changed(); return; }
  if(d.ui){ const k=d.ui; if(k.startsWith('f.')){ UI.f[k.slice(2)]=t.value; if(k==='f.proc') UI.f.maq=''; } else UI[k]=t.value;
    if(k==='ruta'||k==='scnEdit') {} render(true); return; }
  if(d.mix){ UI.mix.sh[d.mix]=+t.value||0; render(true); return; }
  if(d.step){ const [p,s]=d.step.split('#'); const st=DB.routeSteps.find(x=>x.prod===p&&String(x.seq)===s);
    if(t.checked){ if(!st.maquinas.includes(d.m)) st.maquinas.push(d.m); } else st.maquinas=st.maquinas.filter(x=>x!==d.m); changed(); return; }
  if(d.scn){ const s=scnById(UI.scnEdit); if(!s||s.fijo) return; const ks=d.scn.split(':'); let v=t.type==='checkbox'?t.checked:t.value;
    if(ks[0]==='nombre') s.nombre=v;
    else if(ks[0]==='mixOn'){ s.mixOn=v; if(v&&!s.mix){ const m=curM(); const T=m.demKg; s.mix={}; DB.products.forEach(p=>s.mix[p.id]=+(100*(m.dem[p.id]||0)/T).toFixed(1)); } }
    else if(ks[0]==='mix'){ s.mix=s.mix||{}; s.mix[ks[1]]=v===''?0:+v; }
    else if(ks[0]==='cal'){ s.cal=s.cal||{}; s.cal[ks[1]]=s.cal[ks[1]]||{}; if(v==='') delete s.cal[ks[1]][ks[2]]; else s.cal[ks[1]][ks[2]]=+v; }
    else if(ks[0]==='nuevas'){ s.nuevas=s.nuevas||[]; const i=+ks[1]; s.nuevas[i]=s.nuevas[i]||{}; s.nuevas[i][ks[2]]=ks[2]==='velocidad'?(v===''?'':+v):v; s.nuevas=s.nuevas.filter(n=>n&&(n.id||n.clonDe)); }
    else s[ks[0]]=v===''?null:+v;
    saveState(); if(UI.scnActivo===s.id) recalc(); render(true); return; }
  if(d.cmp){ UI.compare=t.checked?[...new Set([...UI.compare,d.cmp])]:UI.compare.filter(x=>x!==d.cmp); render(true); return; }
  if(d.ped){ UI.pedido[d.ped]=t.type==='checkbox'?t.checked:(d.ped==='cant'?+t.value:t.value);
    if(d.ped==='cli'){ const p=DB.products.find(p=>!t.value||p.cliente===t.value); if(p&&t.value&&Engine.ix(DB).prod[UI.pedido.prod]?.cliente!==t.value) UI.pedido.prod=p.id; }
    render(true); return; }
  if(d.cfg){ const [k,type]=d.cfg.split(':'); let v=t.value; if(type==='num') v=+v; if(type==='pct') v=+v/100;
    setPath(CFG,k,v); changed(); return; }
  if(d.tipo){ CFG.tiposDemanda=t.checked?[...new Set([...CFG.tiposDemanda,d.tipo])]:CFG.tiposDemanda.filter(x=>x!==d.tipo); changed(); return; }
  if(d.imp){ const f=t.files[0]; if(!f) return; try{ UI.importMsg=await importFile(d.imp,f); Engine.invalidate(DB); changed(); }catch(err){ UI.importMsg='No se pudo importar: '+err.message; render(true); } return; }
  if('impjson' in d){ const f=t.files[0]; if(!f) return; try{ const o=JSON.parse(await f.text()); if(!o.DB||!o.CFG) throw new Error('El archivo no tiene la estructura del modelo.'); DB=o.DB; CFG=o.CFG; SCN=o.SCN||SCN; UI.importMsg='Modelo importado.'; changed(); }catch(err){ UI.importMsg='No se pudo importar: '+err.message; render(true);} }
});

const ACT={
  go:a=>{ UI.view=a.dataset.v; render(); },
  calcCapex:()=>{ capexResults(); render(true); },
  simTab:a=>{ UI.simTab=a.dataset.t; render(true); },
  pedido:()=>{ const o=UI.pedido; const kg=orderKg(o); UI.pedidoRes=Engine.evaluateOrder(R.db,CFG,{prod:o.prod,kg,fecha:o.fecha,incluirForecast:o.forecast}); render(true); },
  mixReset:()=>{ UI.mix=null; render(true); },
  addMachine:()=>{ const last=DB.machines[DB.machines.length-1]; let n=DB.machines.length+1, id='M'+String(n).padStart(2,'0'); while(DB.machines.some(m=>m.id===id)) id='M'+String(++n).padStart(2,'0');
    DB.machines.push({...structuredClone(last),id,nombre:'Nueva máquina',fechaInicio:''}); changed(); },
  delMachine:a=>{ if(!confirm('¿Eliminar la máquina '+a.dataset.id+'? Se quitará de las rutas.')) return; DB.machines=DB.machines.filter(m=>m.id!==a.dataset.id); DB.routeSteps.forEach(s=>s.maquinas=s.maquinas.filter(x=>x!==a.dataset.id)); changed(); },
  stepAdd:()=>{ const steps=DB.routeSteps.filter(s=>s.prod===UI.ruta); const seq=steps.length?Math.max(...steps.map(s=>s.seq))+1:1; const proc=DB.processes[0].id;
    DB.routeSteps.push({prod:UI.ruta,seq,proc,maquinas:DB.machines.filter(m=>m.procesos.includes(proc)).map(m=>m.id),eficiencia:0.85,yield:0.99,setupH:null,fraccion:1,velocidades:{}}); changed(); },
  stepDel:a=>{ const [p,s]=a.dataset.k.split('#'); DB.routeSteps=DB.routeSteps.filter(x=>!(x.prod===p&&String(x.seq)===s)); renumber(p); changed(); },
  stepUp:a=>{ const [p,s]=a.dataset.k.split('#'); const st=DB.routeSteps.filter(x=>x.prod===p).sort((x,y)=>x.seq-y.seq); const i=st.findIndex(x=>String(x.seq)===s); if(i>0){ const t=st[i].seq; st[i].seq=st[i-1].seq; st[i-1].seq=t; } changed(); },
  scnNew:()=>{ const id='s'+Date.now().toString(36); SCN.push({id,nombre:'Escenario '+SCN.length}); UI.scnEdit=id; UI.compare.push(id); saveState(); render(true); },
  scnDup:()=>{ const s=scnById(UI.scnEdit); const id='s'+Date.now().toString(36); const c=structuredClone(s); c.id=id; c.nombre=s.nombre+' (copia)'; delete c.fijo; SCN.push(c); UI.scnEdit=id; UI.compare.push(id); saveState(); render(true); },
  scnDel:()=>{ const id=UI.scnEdit; SCN=SCN.filter(s=>s.id!==id); UI.compare=UI.compare.filter(x=>x!==id); if(UI.scnActivo===id){UI.scnActivo='base'; recalc();} UI.scnEdit='base'; saveState(); render(true); },
  scnActivate:()=>{ UI.scnActivo=UI.scnEdit; R.capex=null; recalc(); render(true); },
  capexAdd:()=>{ const id=String.fromCharCode(65+DB.capex.length); DB.capex.push({id:DB.capex.some(c=>c.id===id)?'X'+Date.now()%1000:id,nombre:'Nueva alternativa',tipo:'horasExtra',proceso:'LAM',param:20,maquinaId:'',clonDe:'',velocidad:'',fecha:'',inversion:0,opexAnual:null,vida:1}); changed(); },
  capexDel:a=>{ DB.capex=DB.capex.filter(c=>c.id!==a.dataset.id); changed(); },
  tpl:a=>download((SCHEMA[a.dataset.e].t.replace(/\s/g,'_'))+'.csv',toCSV(a.dataset.e)),
  expJSON:()=>download('modelo_capacidad_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({DB,CFG,SCN},null,1),'application/json'),
  resetDemo:()=>{ if(!confirm('Se reemplazarán todos los datos y escenarios por los datos demo.')) return; DB=structuredClone(DEMO.data); CFG=structuredClone(DEMO.cfg); SCN=structuredClone(DEMO.scenarios); UI.scnActivo='base'; UI.importMsg='Datos demo restablecidos.'; changed(); },
  addProc:()=>{ const id=($('#newProcId').value||'').trim().toUpperCase(), nombre=($('#newProcName').value||'').trim(); if(!id||!nombre||DB.processes.some(p=>p.id===id)) return alert('Indica un código nuevo y un nombre.');
    DB.processes.push({id,nombre,unidad:'m',tipo:'Conversión',activo:true}); DB.calendar.push({proc:id,turnos:2,horasTurno:8,diasMes:26,setupH:0.5,cambioRolloMin:6,maxHorasExtra:40,horasExtra:0}); changed(); },
};
function renumber(p){ DB.routeSteps.filter(x=>x.prod===p).sort((a,b)=>a.seq-b.seq).forEach((s,i)=>s.seq=i+1); }
document.addEventListener('click',e=>{ const a=e.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a,e); } });
document.addEventListener('DOMContentLoaded',()=>{
  $('#scnSel').addEventListener('change',e=>{ e.stopPropagation(); UI.scnActivo=e.target.value; R.capex=null; recalc(); render(true); });
  $('#btnPedido').addEventListener('click',()=>{ UI.view='simulador'; UI.simTab='ped'; render(); });
  loadState(); recalc(); render();
});

</script>
