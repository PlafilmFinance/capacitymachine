<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacidad productiva · Módulo de análisis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --steel:#17304d; --steel2:#1f3d60; --rail:#0f2238; --blue:#2a6fdb; --ink:#1b2633; --mut:#5d6a79; --line:#dbe1e8; --line2:#eef1f5;
  --bg:#eef1f4; --card:#fff;
  --green:#1f8a4c; --yellow:#b88c00; --orange:#d9730d; --red:#c62828;
  --greenbg:#e6f3eb; --yellowbg:#fbf3d6; --orangebg:#fcebd9; --redbg:#fbe4e4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Archivo','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:13.5px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--blue);cursor:pointer}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
aside{background:var(--rail);color:#b9c6d6;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:20px 20px 18px;border-bottom:1px solid #1d3552}
.brand b{display:block;color:#fff;font-size:15px;font-weight:700;font-stretch:90%;letter-spacing:.01em}
.brand span{display:block;color:#7f93ad;font-size:12px;margin-top:2px}
nav{padding:8px 0}
nav a{display:flex;gap:10px;align-items:center;padding:8px 20px;color:#b9c6d6;text-decoration:none;border-left:3px solid transparent;font-size:13px}
nav a .n{font-size:11px;color:#5b7290;width:16px;text-align:right}
nav a:hover{background:#132a44;color:#fff}
nav a.on{background:#17324f;color:#fff;border-left-color:#5aa0f0}
nav a.on .n{color:#8fb6ea}
.side-foot{margin-top:auto;padding:14px 20px;font-size:11.5px;color:#6f849f;border-top:1px solid #1d3552}
main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:10px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .t1{font-weight:700;font-stretch:88%;font-size:15px;color:var(--steel)}
.top .sp{flex:1}
.flag{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);padding:4px 4px 4px 10px;border-radius:6px}
.flag.on{background:#fff4e5;color:#8a4a00;box-shadow:inset 0 0 0 1px #f2c38d}
.wrap{padding:22px 28px 48px;max-width:1500px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:24px;font-weight:700;font-stretch:85%;letter-spacing:-.005em;color:var(--steel)}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px;max-width:78ch}
.vh-x{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input{font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid #c6cfda;border-radius:4px;background:#fff;color:var(--ink)}
input[type=number]{width:84px;text-align:right}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input:disabled,select:disabled{background:#f3f5f8;color:#8a95a3}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:4px;border:1px solid var(--steel);background:#fff;color:var(--steel);cursor:pointer}
.btn:hover{background:#f0f4f9}
.btn.pri{background:var(--steel);color:#fff}
.btn.pri:hover{background:var(--steel2)}
.btn.on{background:var(--steel);color:#fff}
.btn.ghost{border-color:#c6cfda;color:var(--mut)}
.xb{border:1px solid #d3dae3;background:#fff;border-radius:3px;cursor:pointer;color:var(--mut);padding:1px 7px;font-size:13px}
.xb:hover{color:var(--red);border-color:var(--red)}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:minmax(320px,1fr) 2fr}
.grid.tight{gap:10px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px;min-width:0}
.grid>.card,.grid>div>.card:last-child{margin-bottom:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;font-stretch:90%;color:var(--steel)}
.card h4{margin:16px 0 8px;font-size:13px;color:var(--steel)}
.card.empty{color:var(--mut);padding:28px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;border-top:3px solid #c9d3df}
.kpi .kl{font-size:12px;color:var(--mut)}
.kpi .kv{font-size:24px;font-weight:700;font-stretch:88%;color:var(--ink);margin:2px 0;white-space:nowrap}
.kpi .ks{font-size:11.5px;color:var(--mut)}
.k-green{border-top-color:var(--green)}.k-yellow{border-top-color:var(--yellow)}.k-orange{border-top-color:var(--orange)}.k-red{border-top-color:var(--red)}
.k-red .kv{color:var(--red)}
.hero{display:grid;grid-template-columns:1.5fr 1fr;background:var(--steel);color:#dfe8f2;border-radius:6px;margin-bottom:14px;overflow:hidden}
.hero-l{padding:20px 24px}
.hl{font-size:13px;color:#9fb4cc}
.hn{font-size:52px;font-weight:800;font-stretch:78%;line-height:1;color:#fff;margin:4px 0 14px;letter-spacing:-.01em}
.hn small{font-size:14px;font-weight:500;font-stretch:100%;color:#9fb4cc;letter-spacing:0;margin-left:8px}
.gauge{max-width:560px}
.gtrack{position:relative;height:14px;background:#0d2136;border-radius:2px}
.gtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.gtrack span{position:absolute;top:-3px;bottom:-3px;width:1px;background:#6f86a2}
.gscale{position:relative;height:16px;font-size:10.5px;color:#7f97b3;margin-top:3px}
.gscale span{position:absolute;transform:translateX(-50%)}
.gscale span:first-child{transform:none}
.hs{margin-top:10px;font-size:13px}
.hero-r{background:#132a44;padding:16px 22px;display:grid;gap:10px;align-content:center}
.hero-r div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #1f3a5a;padding-bottom:8px}
.hero-r div:last-child{border:0;padding:0}
.hero-r span{font-size:12px;color:#9fb4cc}
.hero-r b{font-size:15px;color:#fff;text-align:right}
.hero-r b.t-red{color:#ff9d8f}.hero-r b.t-green{color:#8fe0b0}
.bg-green{background:var(--green)}.bg-yellow{background:#d9a800}.bg-orange{background:var(--orange)}.bg-red{background:var(--red)}.bg-nd{background:#aab4c0}
.ubar{position:relative;height:8px;background:#e7ecf2;border-radius:2px;min-width:110px}
.ubar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.ubar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-green{background:var(--greenbg);color:var(--green)}.p-yellow{background:var(--yellowbg);color:#8a6700}.p-orange{background:var(--orangebg);color:#a5530a}.p-red{background:var(--redbg);color:var(--red)}.p-nd{background:#eef1f4;color:var(--mut)}
.t-red{color:var(--red)}.t-green{color:var(--green)}
.tw{overflow:auto;max-width:100%}
.tw.tall{max-height:70vh}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{text-align:left;font-weight:600;color:var(--mut);font-size:11.5px;border-bottom:1px solid var(--line);padding:7px 8px;background:#f8f9fb;position:sticky;top:0;z-index:1;white-space:nowrap}
.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t .num{text-align:right;white-space:nowrap}
.t td small,.note small{color:var(--mut)}
.t .sm{font-size:11.5px;color:var(--mut)}
.t tr.grp td{background:#f3f6f9;font-weight:600;color:var(--steel);border-top:1px solid var(--line)}
.t tr.grp td small{font-weight:400}
.t td.ind{padding-left:20px}
.t tr.hist td{color:var(--mut);background:#fafbfc}
.t tr.row-red td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.t tr.best td{background:#eef5ff}
.t tr.best td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.t.kv td:first-child{color:var(--mut)}
.t.cmp td:first-child{color:var(--mut);white-space:nowrap}
.ed-t td{padding:4px 5px}
.ed-t input,.ed-t select{padding:3px 5px}
.nowrap{white-space:nowrap}
.heat td.hc{text-align:center;font-size:11.5px;min-width:46px;padding:5px 3px}
.h-green{background:#d6eddf;color:#185f37}.h-yellow{background:#f8e9a8;color:#6d5200}.h-orange{background:#f6c38f;color:#7a3c05}.h-red{background:#e57373;color:#fff;font-weight:700}.h-nd{background:#fafbfc}
.alerts{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
.al{display:flex;gap:10px;padding:8px 10px;border-radius:4px;font-size:12.5px;line-height:1.4}
.al>span{font-size:11px;padding-top:2px}
.al-red{background:var(--redbg)}.al-red>span{color:var(--red)}
.al-orange{background:var(--orangebg)}.al-orange>span{color:var(--orange)}
.al-yellow{background:var(--yellowbg)}.al-yellow>span{color:var(--yellow)}
.al-green{background:var(--greenbg)}.al-green>span{color:var(--green)}
.note{font-size:12px;color:var(--mut);margin:10px 0 0;max-width:120ch}
.banner{background:#e9f1fc;border:1px solid #c3d7f3;color:#1d4d8f;padding:9px 12px;border-radius:5px;margin-bottom:14px;font-size:12.5px}
.filters{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.chw{position:relative;width:100%}
.nochart{padding:30px;text-align:center;color:var(--mut);background:#f8f9fb;border:1px dashed var(--line);border-radius:4px;font-size:12.5px}
.status{font-size:24px;font-weight:800;font-stretch:85%;padding:12px 16px;border-radius:5px;letter-spacing:.01em}
.st-green{background:var(--greenbg);color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.st-orange{background:var(--orangebg);color:#a5530a;box-shadow:inset 4px 0 0 var(--orange)}
.st-red{background:var(--redbg);color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.msg{font-size:14px;margin:12px 0;max-width:90ch}
.fl{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.fl>span:first-child{width:150px;color:var(--mut);flex:none}
.fl input[type=text],.fl select{min-width:200px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 18px}
.fgrid .fl>span:first-child{width:130px}
.tabs{display:flex;gap:2px;margin:-4px 0 16px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 16px;color:var(--mut);text-decoration:none;border-bottom:2px solid transparent;font-weight:600}
.tabs a.on{color:var(--steel);border-bottom-color:var(--steel)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.mc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin:2px;font-size:12px;cursor:pointer;background:#fafbfc}
.mc.on{background:#e8f0fc;border-color:#9fc0ef}
.mc.bad{background:var(--orangebg);border-color:#efb88a}
.route-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.route-flow span{background:var(--steel);color:#fff;padding:5px 12px;border-radius:3px;font-weight:600;font-size:12.5px}
.route-flow i{color:var(--mut);font-style:normal}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:14px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:8px}
.dcard b{display:block;color:var(--steel)}
.dcard small{color:var(--mut);font-size:11.5px}
.dact{display:flex;gap:8px}
.dcard .cols{font-size:11px;color:#7a8696;line-height:1.5}
.semdemo{display:flex;gap:6px;margin:8px 0 18px}
.sup{margin:0;padding-left:18px;color:var(--mut);font-size:12.5px}
.sup li{margin:3px 0}
@media (max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12,.hero{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}nav{display:flex;flex-wrap:wrap}nav a{padding:6px 12px}.side-foot{display:none}.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:16px}.hn{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>Capacidad productiva</b><span>Empaques flexibles · planta</span></div>

    <div class="side-foot">Datos demo. Reemplázalos en Datos.<br>Montos en COP.</div>

  <main>

      <span class="t1">Módulo de análisis de capacidad</span>

      <button class="btn pri" id="btnPedido">Analizar nuevo pedido</button>

</div>
<script>
/* =====================================================================
   UTILIDADES DE PERÍODO
   ===================================================================== */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function monthsFrom(start, n){
  const out=[]; let y=+start.slice(0,4), m=+start.slice(5,7);
  for(let i=0;i<n;i++){ out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if(m>12){m=1;y++;} }
  return out;
}
function monthShift(ym,k){ let y=+ym.slice(0,4), m=+ym.slice(5,7)+k; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${String(m).padStart(2,'0')}`; }
function daysInMonth(ym){ return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }
function lab(ym){ return MESES[+ym.slice(5,7)-1]+' '+ym.slice(2,4); }

   1. CAPA DE DATOS (DEMO) — estructuras reemplazables por datos reales
   ===================================================================== */

    {id:'INS', nombre:'Inspección',        unidad:'m',     tipo:'Calidad',        activo:true},
    {id:'SEL', nombre:'Sellado',           unidad:'m',     tipo:'Conversión',     activo:true},
    {id:'PEG', nombre:'Pegado',            unidad:'m',     tipo:'Conversión',     activo:true},
    {id:'COR', nombre:'Corte',             unidad:'golpe', tipo:'Conversión',     activo:true},
    {id:'REB', nombre:'Rebobine',          unidad:'m',     tipo:'Conversión',     activo:true},
  ];
  // Calendario y tiempos estándar POR PROCESO (turnos por proceso; tiempos de cambio y de cambio de rollo)
  const calendar = [
    {proc:'REF', turnos:2, horasTurno:8, diasMes:26, setupH:0.33, cambioRolloMin:6,  maxHorasExtra:40, horasExtra:0},

    {proc:'INS', turnos:3, horasTurno:8, diasMes:26, setupH:0.25, cambioRolloMin:5,  maxHorasExtra:40, horasExtra:0},
    {proc:'SEL', turnos:2, horasTurno:8, diasMes:26, setupH:0.75, cambioRolloMin:8,  maxHorasExtra:40, horasExtra:0},
    {proc:'PEG', turnos:2, horasTurno:8, diasMes:26, setupH:0.75, cambioRolloMin:8,  maxHorasExtra:40, horasExtra:0},
    {proc:'COR', turnos:2, horasTurno:8, diasMes:26, setupH:0.50, cambioRolloMin:6,  maxHorasExtra:40, horasExtra:0},
    {proc:'REB', turnos:2, horasTurno:8, diasMes:26, setupH:0.25, cambioRolloMin:5,  maxHorasExtra:40, horasExtra:0},
  ];
  // Máquinas: velocidad promedio en m/min (Corte en golpes/min); anchos en mm; diámetro máx. de rollo en mm
  const M=(id,nombre,procesos,velocidad,anchoMin,anchoMax,diamMax,familias,eficiencia,mantH,limpH,paradasH,cambioRolloMin,fechaInicio,vidaUtil,costoHora)=>
    ({id,nombre,procesos,velocidad,anchoMin,anchoMax,diamMax,familias,eficiencia,mantH,limpH,paradasH,cambioRolloMin,setupH:null,estado:'Activa',fechaInicio,vidaUtil,costoHora});
  const machines = [
    M('R01','Refiladora 1',['REF','RFI'],380,300,1350, 800,[],0.85,12,8,18,null,'2012-03',20,180000),
    M('R02','Refiladora 2',['REF','RFI'],420,300,1350,1000,[],0.86,12,8,16,null,'2016-06',20,190000),
    M('R03','Refiladora 3',['REF','RFI'],480,200,1600,1000,[],0.88,10,8,12,null,'2021-02',20,220000),
    M('I01','Impresora flexo 6 col.',['IMP'],160,400,1000, 800,['Monocapa','Bolsas'],0.78,24,16,30,null,'2010-01',20,650000),
    M('I02','Impresora flexo 8 col.',['IMP'],200,400,1250,1000,[],0.80,24,16,28,null,'2015-05',20,720000),
    M('I03','Impresora flexo 10 col.',['IMP'],250,500,1300,1000,[],0.82,20,16,24,null,'2019-09',20,850000),
    M('I04','Impresora flexo 8 col. CI',['IMP'],220,400,1300,1000,['Laminados','Monocapa','Pouches'],0.80,20,16,26,null,'2017-04',20,780000),
    M('L01','Laminadora sin solvente 1',['LAM'],220,500,1300,1000,[],0.82,16,10,22,null,'2014-08',20,520000),
    M('L02','Laminadora sin solvente 2',['LAM'],280,500,1300,1000,['Laminados','Bolsas'],0.84,16,10,18,null,'2020-11',20,600000),
    M('IN01','Inspectora 1',['INS'],420,200,1300,1000,[],0.88,8,6,10,null,'2018-01',15,150000),
    M('S01','Selladora 1',['SEL'],70,150,1000,800,['Bolsas','Pouches'],0.80,10,8,16,null,'2011-01',15,140000),
    M('S02','Selladora 2',['SEL'],80,150,1000,800,['Bolsas'],0.82,10,8,14,null,'2016-01',15,150000),
    M('S03','Selladora 3',['SEL'],90,150,1000,800,['Bolsas','Pouches'],0.84,10,8,12,null,'2022-03',15,170000),
    M('P01','Pegadora 1',['PEG'],60,150,1000,800,['Pouches'],0.80,10,8,14,null,'2018-07',15,160000),
    M('C01','Cortadora 1',['COR'],90,100,600,800,[],0.82,8,6,12,null,'2013-01',15,130000),
    M('C02','Cortadora 2',['COR'],120,100,600,800,[],0.85,8,6,10,null,'2019-01',15,150000),
    M('C03','Cortadora 3',['COR'],110,100,1000,800,['Laminados','Pouches'],0.84,8,6,10,null,'2020-01',15,150000),
    M('RB01','Rebobinadora 1',['REB'],500,100,1000,800,[],0.86,8,6,10,null,'2015-01',15,120000),
    M('RB02','Rebobinadora 2',['REB'],450,100,1000,800,[],0.84,8,6,12,null,'2012-01',15,110000),
  ];
  const customers = [
    {id:'C01', nombre:'Alimentos del Pacífico', segmento:'Alimentos'},
    {id:'C02', nombre:'Snacks Andinos',         segmento:'Snacks'},
    {id:'C03', nombre:'Bebidas del Valle',      segmento:'Bebidas'},
    {id:'C04', nombre:'Molinos Unidos',         segmento:'Granos'},

/* =====================================================================
   2. MOTOR DE CÁLCULO — funciones puras: (datos, configuración) → resultados
   ===================================================================== */
const Engine = (()=>{
  const W = new WeakMap();
  const invalidate = db => W.delete(db);
  function ix(db){
    let x=W.get(db); if(x) return x;
    x={proc:{},cal:{},mach:{},prod:{},cust:{},marg:{},down:{},steps:{}};
    db.processes.forEach(p=>x.proc[p.id]=p);
    db.calendar.forEach(c=>x.cal[c.proc]=c);
    db.machines.forEach(m=>x.mach[m.id]=m);
    db.products.forEach(p=>x.prod[p.id]=p);
    db.customers.forEach(c=>x.cust[c.id]=c);
    db.margins.forEach(m=>x.marg[m.prod]=m);
    db.downtime.forEach(d=>x.down[d.machine+'|'+d.mes]=d);
    db.routeSteps.forEach(s=>{(x.steps[s.prod]=x.steps[s.prod]||[]).push(s);});
    Object.values(x.steps).forEach(a=>a.sort((a,b)=>a.seq-b.seq));
    W.set(db,x); return x;
  }
  const nz = v => v!==null && v!=='' && v!==undefined && !isNaN(+v);
  const margin = (db,pid)=> +(ix(db).marg[pid]?.margenKg||0);
  const price  = (db,pid)=> +(ix(db).marg[pid]?.precioKg||0);
  const gramaje = p => p.estructura.reduce((s,l)=>s+l.micras*l.densidad,0)+(+p.gramajeAdic||0);
  function calibreAt(p,seq){ const c=p.estructura.filter(l=>l.paso<=seq).reduce((s,l)=>s+(+l.micras),0); return c || (+p.estructura[0]?.micras||20); }

  // Explosión de la ruta: metros por kg de producto terminado en cada paso (mermas en cascada y pistas tras refile de impreso)
  function factors(db,p){
    const steps=ix(db).steps[p.id]||[]; const g=gramaje(p);
    const mpk = 1000/(g*p.anchoWeb);
    const iR = steps.findIndex(s=>s.proc==='RFI');
    const out=new Array(steps.length); let cum=1;
    for(let i=steps.length-1;i>=0;i--){
      cum *= (+steps[i].yield||1);
      const after = iR>=0 && i>iR; const pis = after ? (+p.pistas||1) : 1;
      out[i] = { step:steps[i], mPerKg: mpk*pis/cum, calibre: calibreAt(p,steps[i].seq),
                 anchoMm: (p.anchoWeb*1000)/pis, yieldAcum: cum };
    }
    return out;
  }
  function reasons(db,p,f,m){
    const r=[]; if(!m) return ['Máquina inexistente'];
    if(!m.procesos.includes(f.step.proc)) r.push('No ejecuta este proceso');
    if(m.estado!=='Activa') r.push('Máquina inactiva');
    if(f.anchoMm < m.anchoMin || f.anchoMm > m.anchoMax) r.push(`Ancho ${Math.round(f.anchoMm)} mm fuera de ${m.anchoMin}–${m.anchoMax} mm`);
    if(m.familias && m.familias.length && !m.familias.includes(p.familia)) r.push(`No procesa ${p.familia}`);
    return r;
  }
  const eff = (cfg,m,s)=>{ const a=+m.eficiencia||1, b=+s.eficiencia||1;
    return cfg.effSource==='maquina'?a : cfg.effSource==='ruta'?b : a*b; };
  const speed = (m,s)=> (s.velocidades && nz(s.velocidades[m.id])) ? +s.velocidades[m.id] : +m.velocidad;
  function rollLen(cfg,m,cal){ const D=m.diamMax/1000, d=cfg.diamCore/1000, t=cal*1e-6; return Math.max(1, Math.PI*(D*D-d*d)/(4*t)); }
  function setupH(db,m,s){ if(nz(s.setupH)) return +s.setupH; if(nz(m.setupH)) return +m.setupH; return +(ix(db).cal[s.proc]?.setupH||0); }
  function rollMin(db,m,s){ return nz(m.cambioRolloMin) ? +m.cambioRolloMin : +(ix(db).cal[s.proc]?.cambioRolloMin||0); }
  function perKg(db,cfg,p,f,m){
    const pr=ix(db).proc[f.step.proc];
    const v=speed(m,f.step)*60, e=eff(cfg,m,f.step);
    const golpe = pr && pr.unidad==='golpe';
    const q = golpe ? f.mPerKg/(+p.largo||0.25) : f.mPerKg;
    const hProc = q/(v*e);
    const rl = rollLen(cfg,m,f.calibre);
    const hRoll = f.mPerKg/rl * rollMin(db,m,f.step)/60;
    return {hProc,hRoll,qty:q,rollLen:rl,unidad:golpe?'golpes':'m'};
  }
  // Fracción del volumen del producto que pasa por el paso (1 = todo; p. ej. 0,28 si solo el 28 % pasa por INS-VENUS)
  const frac = s=> nz(s.fraccion) ? Math.max(0,Math.min(1,+s.fraccion)) : 1;
  const runs = (p,kg)=> kg>0 ? Math.ceil(kg/(+p.loteKg||kg)) : 0;
  function options(db,cfg,p,f,kg){
    const x=ix(db), n=runs(p,kg);
    return (f.step.maquinas||[]).map(id=>x.mach[id]).filter(m=>m && reasons(db,p,f,m).length===0).map(m=>{
      const fr=frac(f.step), k=perKg(db,cfg,p,f,m), s=n*setupH(db,m,f.step)*fr;
      return {m:m.id, hProc:kg*k.hProc*fr, hRoll:kg*k.hRoll*fr, hSetup:s, h:kg*(k.hProc+k.hRoll)*fr+s, qty:kg*k.qty*fr, hPerKg:(k.hProc+k.hRoll)*fr};
    });
  }
  // Capacidad de una máquina en un mes (horas). Calendario del primer proceso de la máquina.
  function cap(db,m,ym){
    const x=ix(db), c=x.cal[m.procesos[0]]||{turnos:0,horasTurno:0,diasMes:0};
    const d=x.down[m.id+'|'+ym];
    const mant=d?+d.mant:+m.mantH||0, limp=d?+d.limp:+m.limpH||0, par=d?+d.paradas:+m.paradasH||0;
    const enOper = !m.fechaInicio || m.fechaInicio.slice(0,7) <= ym;
    const act = (m.estado==='Activa' && enOper) ? 1 : 0;
    const teor = c.turnos*c.horasTurno*c.diasMes;
    const paros = mant+limp+par;
    const extra = +c.horasExtra||0;
    const disp = act*(Math.max(0,teor-paros)+extra);
    return {inst:act*24*daysInMonth(ym), teor:act*teor, mant, limp, par, paros:act*paros, extra:act*extra, disp,
            disponibilidad: teor? Math.max(0,teor-paros)/teor : 0};
  }
  function demandBy(db,ym,tipos){ const o={}; db.demand.forEach(r=>{ if(r.mes===ym && tipos.includes(r.tipo)) o[r.prod]=(o[r.prod]||0)+(+r.kg); }); return o; }

  function mph(db,r,pid){ const bp=r.load.byProd[pid]; if(!bp||bp.h<=0) return null; const kg=Math.max(...Object.values(bp.kg)); return margin(db,pid)*kg/bp.h; }
  function kgThrough(r,pid){ const bp=r.load.byProd[pid]; return bp? Math.max(...Object.values(bp.kg)) : 0; }

  function lostSales(db,mres,dem,th){
    const lostKg={};
    mres.forEach(r=>{
      if(!(r.util>th) || r.load.h<=0) return;
      let ex=r.load.h-r.cap.disp;
      const ps=Object.keys(r.load.byProd).map(pid=>({pid,v:mph(db,r,pid),h:r.load.byProd[pid].h,kg:kgThrough(r,pid)})).sort((a,b)=>a.v-b.v);
      for(const q of ps){ if(ex<=0) break; const rem=Math.min(q.h,ex); const kgL=q.kg*rem/q.h; lostKg[q.pid]=Math.max(lostKg[q.pid]||0,kgL); ex-=rem; }
    });
    let kg=0,mg=0,vt=0;
    for(const pid in lostKg){ const v=Math.min(lostKg[pid],dem[pid]||0); lostKg[pid]=v; kg+=v; mg+=v*margin(db,pid); vt+=v*price(db,pid); }
    return {byProd:lostKg,kg,margen:mg,ventas:vt};
  }

  function runMonth(db,cfg,ym,opt={}){
    const x=ix(db), tipos=opt.tipos||cfg.tiposDemanda;
    const dem = opt.demand || demandBy(db,ym,tipos);
    const caps={}, loads={};
    db.machines.forEach(m=>{ caps[m.id]=cap(db,m,ym); loads[m.id]={h:0,hProc:0,hRoll:0,hSetup:0,byProd:{},byProc:{}}; });
    const tasks=[], issues=[]; let demKg=0, margen=0, ventas=0;
    for(const pid in dem){
      const p=x.prod[pid], kg=+dem[pid];
      if(!p || !(kg>0) || p.estado!=='Activo') continue;
      demKg+=kg; margen+=kg*margin(db,pid); ventas+=kg*price(db,pid);
      factors(db,p).forEach(f=>{
        const op=options(db,cfg,p,f,kg);
        if(!op.length){ issues.push({prod:pid,seq:f.step.seq,proc:f.step.proc,msg:'Sin máquina compatible activa'}); return; }
        tasks.push({pid,kg,f,op});
      });
    }
    const pol=opt.politica||cfg.politica, N=cfg.chunks||24;
    tasks.sort((a,b)=>a.op.length-b.op.length || b.op[0].h-a.op[0].h);
    const add=(t,o,fr)=>{ const L=loads[o.m];
      L.h+=o.h*fr; L.hProc+=o.hProc*fr; L.hRoll+=o.hRoll*fr; L.hSetup+=o.hSetup*fr;
      const bp=L.byProd[t.pid]||(L.byProd[t.pid]={h:0,kg:{}});
      bp.h+=o.h*fr; bp.kg[t.f.step.seq]=(bp.kg[t.f.step.seq]||0)+t.kg*fr;
      L.byProc[t.f.step.proc]=(L.byProc[t.f.step.proc]||0)+o.h*fr; };
    tasks.forEach(t=>{
      if(pol==='preferente' || t.op.length===1){ add(t,t.op[0],1); return; }
      for(let k=0;k<N;k++){
        let best=null, bu=Infinity;
        t.op.forEach(o=>{ const c=caps[o.m].disp; const u=c>0?(loads[o.m].h+o.h/N)/c:Infinity; if(u<bu){bu=u;best=o;} });
        add(t,best||t.op[0],1/N);
      }
    });
    const mres=db.machines.map(m=>{ const L=loads[m.id], C=caps[m.id];
      const util=C.disp>0?L.h/C.disp:(L.h>0?Infinity:0);
      return {id:m.id,m,cap:C,load:L,util,libre:C.disp-L.h}; });
    const pools=db.processes.filter(p=>p.activo).map(p=>{
      const ms=mres.filter(r=>r.m.procesos.includes(p.id));
      const disp=ms.reduce((s,r)=>s+r.cap.disp,0), h=ms.reduce((s,r)=>s+r.load.h,0);
      const hProcOnly=ms.reduce((s,r)=>s+(r.load.byProc[p.id]||0),0);
      return {id:p.id,p,machines:ms.map(r=>r.id),disp,h,hProcOnly,util:disp>0?h/disp:(h>0?Infinity:0)}; });
    const ranked=[...mres].filter(r=>r.load.h>0).sort((a,b)=>b.util-a.util);
    const bn=ranked[0]||null, maxU=bn?bn.util:0;
    const capKg = maxU>0 && isFinite(maxU) ? demKg/maxU : null;
    const lost=lostSales(db,mres,dem,cfg.sem.rojo);
    return {ym,dem,demKg,margen,ventas,mres,pools,ranked,bn,maxU,capKg,lost,issues};
  }

  function run(db,cfg,opt={}){
    const months = opt.months || monthsFrom(cfg.mesInicio,cfg.horizonte);
    const res = months.map(ym=>runMonth(db,cfg,ym,opt));
    const th=cfg.sem.rojo;
    const sr=res.find(r=>r.maxU>th);
    const sp=res.find(r=>r.pools.some(p=>p.util>th));
    let satProceso=null; if(sp){ const pmax=[...sp.pools].sort((a,b)=>b.util-a.util)[0]; satProceso={ym:sp.ym,id:pmax.id,u:pmax.util}; }
    return {months:res, satRecurso: sr?{ym:sr.ym,id:sr.bn.id,u:sr.maxU}:null, satProceso};
  }

  /* ---------- Escenarios: overrides sobre una copia de los datos ---------- */
  function applyScenario(base,s,cfg){
    const db=structuredClone(base);
    if(!s) return db;
    if(nz(s.demandaPct) && +s.demandaPct!==0) db.demand.forEach(r=>{ if(r.tipo!=='Histórico') r.kg=r.kg*(1+s.demandaPct/100); });
    if(s.mixOn && s.mix){
      const sh=s.mix, tot=Object.values(sh).reduce((a,b)=>a+(+b||0),0);
      if(tot>0){
        const keys=new Set(db.demand.filter(r=>r.tipo!=='Histórico').map(r=>r.mes+'|'+r.tipo));
        keys.forEach(k=>{ const [mes,tipo]=k.split('|'); const rows=db.demand.filter(r=>r.mes===mes&&r.tipo===tipo);
          const T=rows.reduce((a,r)=>a+r.kg,0); const old={}; rows.forEach(r=>old[r.prod]=(old[r.prod]||0)+r.kg);
          Object.keys(sh).forEach(pid=>{ const nk=T*(+sh[pid]||0)/tot;
            if(old[pid]>0) rows.filter(r=>r.prod===pid).forEach(r=>r.kg=r.kg*nk/old[pid]);
            else if(nk>0) db.demand.push({prod:pid,mes,tipo,kg:nk}); });
          rows.filter(r=>!(r.prod in sh)).forEach(r=>r.kg=0);
        });
      }
    }
    if(s.cal) Object.entries(s.cal).forEach(([proc,v])=>{ const c=db.calendar.find(c=>c.proc===proc); if(!c) return;
      Object.entries(v).forEach(([k,val])=>{ if(nz(val)) c[k]=+val; });
      if(c.turnos*c.horasTurno>24) c.turnos=Math.floor(24/c.horasTurno); });
    const src = cfg?.effSource||'ruta';
    const dPP = proc => ((+s.efPP||0) + (+(s.efProc?.[proc])||0))/100;
    if(nz(s.efPP) || s.efProc){
      if(src!=='ruta') db.machines.forEach(m=>{ m.eficiencia=Math.min(0.99,(+m.eficiencia)+dPP(m.procesos[0])); });
      if(src!=='maquina') db.routeSteps.forEach(st=>{ st.eficiencia=Math.min(0.99,(+st.eficiencia)+dPP(st.proc)); });
    }
    if(nz(s.velPct) && +s.velPct!==0){ db.machines.forEach(m=>m.velocidad*=1+s.velPct/100);
      db.routeSteps.forEach(st=>Object.keys(st.velocidades||{}).forEach(k=>{ if(nz(st.velocidades[k])) st.velocidades[k]*=1+s.velPct/100; })); }
    if(nz(s.paradasPct) && +s.paradasPct!==0){ db.machines.forEach(m=>m.paradasH*=1-s.paradasPct/100); db.downtime.forEach(d=>d.paradas*=1-s.paradasPct/100); }
    if(nz(s.setupPct) && +s.setupPct!==0){ const f=1+s.setupPct/100; db.calendar.forEach(c=>c.setupH*=f);
      db.machines.forEach(m=>{ if(nz(m.setupH)) m.setupH*=f; }); db.routeSteps.forEach(st=>{ if(nz(st.setupH)) st.setupH*=f; }); }
    (s.nuevas||[]).forEach(n=>{ if(!n||!n.id||!n.clonDe) return; const src=db.machines.find(m=>m.id===n.clonDe); if(!src||db.machines.some(m=>m.id===n.id)) return;
      const nm=structuredClone(src); nm.id=n.id; nm.nombre=n.nombre||('Nueva '+src.nombre.toLowerCase()); nm.fechaInicio=n.fecha||''; nm.familias=[];
      if(nz(n.velocidad)) nm.velocidad=+n.velocidad; db.machines.push(nm);
      db.routeSteps.forEach(st=>{ if(st.maquinas.includes(src.id) && !st.maquinas.includes(n.id)) st.maquinas.push(n.id); }); });
    return db;
  }

  /* ---------- Aceptación de pedidos ---------- */
  function windowMonths(fromDate,toDate){
    const a=new Date(fromDate+'T00:00:00'), b=new Date(toDate+'T00:00:00'); if(isNaN(b)||b<a) return [];
    const out=[]; let y=a.getFullYear(), mo=a.getMonth();
    while(y<b.getFullYear() || (y===b.getFullYear() && mo<=b.getMonth())){
      const dim=new Date(y,mo+1,0).getDate();
      const s=(y===a.getFullYear()&&mo===a.getMonth())?a.getDate():1;
      const e=(y===b.getFullYear()&&mo===b.getMonth())?b.getDate():dim;
      out.push({ym:`${y}-${String(mo+1).padStart(2,'0')}`,frac:(e-s+1)/dim});
      mo++; if(mo>11){mo=0;y++;}
    }
    return out;
  }
  function freeHours(db,cfg,win,tipos){
    const free={}, ot={}, cache={};
    db.machines.forEach(m=>{free[m.id]=0; ot[m.id]=0;});
    win.forEach(w=>{ const r=cache[w.ym]||(cache[w.ym]=runMonth(db,cfg,w.ym,{tipos}));
      r.mres.forEach(x=>{ free[x.id]+=w.frac*Math.max(0,x.cap.disp-x.load.h);
        const c=ix(db).cal[x.m.procesos[0]]; ot[x.id]+= x.cap.disp>0 ? w.frac*(+c?.maxHorasExtra||0) : 0; }); });
    return {free,ot};
  }
  function allocOrder(db,cfg,p,kg,avail){
    const fs=factors(db,p), rem={...avail}, steps=[]; let ok=true;
    fs.forEach(fx=>{
      const op=options(db,cfg,p,fx,kg), pr=ix(db).proc[fx.step.proc];
      if(!op.length){ ok=false; steps.push({step:fx.step,proc:pr,noCompat:true,req:0,disp:0,asign:{},short:Infinity,op}); return; }
      const ms=[...new Set(op.map(o=>o.m))];
      const dispBefore=ms.reduce((s,m)=>s+Math.max(0,rem[m]),0);
      const asign={}, N=20;
      for(let k=0;k<N;k++){ let best=null,bv=-Infinity;
        op.forEach(o=>{ const v=rem[o.m]-o.h/N; if(v>bv){bv=v;best=o;} });
        rem[best.m]-=best.h/N; asign[best.m]=(asign[best.m]||0)+best.h/N; }
      let req=0, short=0; Object.keys(asign).forEach(m=>{ req+=asign[m]; short+=Math.min(asign[m],Math.max(0,-rem[m])); });
      if(short>1e-6) ok=false;
      steps.push({step:fx.step,proc:pr,req,disp:dispBefore,asign,short,op});
    });
    return {ok,steps,rem};
  }
  function lastDay(ym){ return `${ym}-${String(daysInMonth(ym)).padStart(2,'0')}`; }
  function evaluateOrder(db,cfg,o){
    const p=ix(db).prod[o.prod];
    if(!p) return {error:'Producto no encontrado.'};
    if(!(o.kg>0)) return {error:'Ingresa una cantidad mayor que cero.'};
    const win=windowMonths(cfg.fechaCorte,o.fecha);
    if(!win.length) return {error:'La fecha requerida es anterior a la fecha de corte del modelo ('+cfg.fechaCorte+').'};
    const tipos=o.incluirForecast?['Confirmado','Forecast']:['Confirmado'];
    const {free,ot}=freeHours(db,cfg,win,tipos);
    const base=allocOrder(db,cfg,p,o.kg,free);
    const res={p,o,win,free,ot,base,margen:o.kg*margin(db,p.id),ventas:o.kg*price(db,p.id),maxKg:o.kg};
    const nc=base.steps.find(s=>s.noCompat);
    if(nc){ res.estado='NO ACEPTABLE'; res.motivo=`El paso ${nc.step.seq} (${nc.proc?.nombre||nc.step.proc}) no tiene máquinas compatibles activas.`; return res; }
    if(base.ok){ res.estado='ACEPTABLE'; }
    else{
      let lo=0,hi=o.kg; for(let i=0;i<28;i++){ const mid=(lo+hi)/2; if(allocOrder(db,cfg,p,mid,free).ok) lo=mid; else hi=mid; }
      res.maxKg=lo;
      const withOT={}; for(const k in free) withOT[k]=free[k]+ot[k];
      const r2=allocOrder(db,cfg,p,o.kg,withOT);
      if(r2.ok){
        const extra={}; let costo=0, hx=0;
        for(const k in free){ const used=withOT[k]-r2.rem[k]; const e=Math.max(0,used-free[k]); if(e>1e-6){ extra[k]=e; hx+=e; costo+=e*(+ix(db).mach[k].costoHora||0)*(1+cfg.recargoHoraExtra); } }
        res.estado='ACEPTABLE CON RESTRICCIONES'; res.palanca='horasExtra'; res.extra=extra; res.horasExtra=hx; res.costoExtra=costo; res.alloc=r2;
      } else if(lo > o.kg*0.02){
        res.estado='ACEPTABLE CON RESTRICCIONES'; res.palanca='parcial';
      } else res.estado='NO ACEPTABLE';
      if(res.palanca!=='horasExtra'){
        const fm=o.fecha.slice(0,7);
        for(let k=0;k<=12;k++){ const ym=monthShift(fm,k); const end=lastDay(ym); if(end<=o.fecha) continue;
          const w2=windowMonths(cfg.fechaCorte,end); const fh=freeHours(db,cfg,w2,tipos);
          if(allocOrder(db,cfg,p,o.kg,fh.free).ok){ res.fechaCompleta=end; break; } }
      }
    }
    // recurso limitante
    const src = res.alloc || base;
    let lim=null, limScore=-Infinity;
    src.steps.forEach(st=>Object.keys(st.asign).forEach(m=>{
      const av = (res.palanca==='horasExtra'? free[m]+ot[m] : free[m]);
      const score = st.short>0 ? 1e9+st.short : (av>0? st.asign[m]/av : 1e9);
      if(score>limScore){ limScore=score; lim={m,step:st,h:st.asign[m],av}; } }));
    res.limitante=lim;
    if(lim){ const hOnLim = src.steps.reduce((s,st)=>s+(st.asign[lim.m]||0),0); res.hLim=hOnLim; res.mphLim = hOnLim>0? res.margen/hOnLim : null; }
    return res;
  }

  /* ---------- CAPEX ---------- */
  function capexScenario(base,a){
    switch(a.tipo){
      case 'eficiencia': return {efProc:{[a.proceso]:+a.param||0}};
      case 'turno': { const c=base.calendar.find(c=>c.proc===a.proceso)||{turnos:0}; return {cal:{[a.proceso]:{turnos:(+c.turnos)+(+a.param||1)}}}; }
      case 'horasExtra': return {cal:{[a.proceso]:{horasExtra:+a.param||0}}};
      case 'maquina': return {nuevas:[{id:a.maquinaId||('N'+a.id),clonDe:a.clonDe,velocidad:a.velocidad,fecha:a.fecha}]};
    }
    return {};
  }
  function npv(r,flows){ return flows.reduce((s,f,t)=>s+f/Math.pow(1+r,t),0); }
  function irr(flows){ if(!(flows[0]<0) || !flows.slice(1).some(f=>f>0)) return null;
    let lo=-0.99,hi=10; if(npv(hi,flows)>0) return null;
    for(let i=0;i<100;i++){ const mid=(lo+hi)/2; if(npv(mid,flows)>0) lo=mid; else hi=mid; } return (lo+hi)/2; }
  function evalCapex(base,cfg,a,baseRun){
    const db=applyScenario(base,capexScenario(base,a),cfg); invalidate(db);
    const r=run(db,cfg);
    const served = run_ => run_.months.reduce((s,m)=>s+m.margen-m.lost.margen,0);
    const servedKg = run_ => run_.months.reduce((s,m)=>s+m.demKg-m.lost.kg,0);
    const servedV = run_ => run_.months.reduce((s,m)=>s+m.ventas-m.lost.ventas,0);
    const incr=served(r)-served(baseRun), kgIncr=servedKg(r)-servedKg(baseRun), vIncr=servedV(r)-servedV(baseRun);
    let capH=0;
    r.months.forEach((m,i)=>{ const b=baseRun.months[i];
      m.mres.filter(x=>x.m.procesos.includes(a.proceso)).forEach(x=>{ const bx=b.mres.find(y=>y.id===x.id); capH+=x.cap.disp-(bx?bx.cap.disp:0); }); });
    const capKg = r.months.reduce((s,m,i)=>s+((m.capKg||0)-(baseRun.months[i].capKg||0)),0);
    let opex=+a.opexAnual||0, opexAuto=false;
    if(a.tipo==='horasExtra' && !nz(a.opexAnual)){ opexAuto=true; opex=0;
      r.months.forEach(m=>m.mres.forEach(x=>{ if(!x.m.procesos.includes(a.proceso)) return;
        const used=Math.max(0,Math.min(x.cap.extra, x.load.h-(x.cap.disp-x.cap.extra)));
        opex+=used*(+x.m.costoHora||0)*(1+cfg.recargoHoraExtra); })); }
    const ebitda=incr-opex, inv=+a.inversion||0, vida=Math.max(1,+a.vida||1);
    const flows=[-inv, ...Array(vida).fill(ebitda)];
    const payback = ebitda>0 ? inv/ebitda : null;
    const peak=[...r.months].sort((x,y)=>y.maxU-x.maxU)[0];
    return {a,capH,capKg,kgIncr,ventasIncr:vIncr,margenIncr:incr,opex,opexAuto,ebitda,payback,
            roi: inv>0? ebitda/inv : null, roiVida: inv>0? (ebitda*vida-inv)/inv : null,
            vpn:npv(cfg.tasaDescuento,flows), tir:inv>0?irr(flows):null,
            sigCuello: peak&&peak.bn? {id:peak.bn.id,u:peak.maxU,ym:peak.ym}:null, run:r};
  }

  return {invalidate,ix,margin,price,gramaje,calibreAt,factors,reasons,perKg,options,cap,setupH,runs,eff,speed,
          demandBy,runMonth,run,applyScenario,evaluateOrder,windowMonths,capexScenario,evalCapex,mph,kgThrough};
})();


</script>
<script>
/* =====================================================================
   3. ESTADO DE LA APLICACIÓN
   ===================================================================== */
const STORE_KEY='capprod_v1';
let DB, CFG, SCN, R;
const UI={view:'resumen', mes:null, scnActivo:'base',
  f:{proc:'',maq:'',fam:'',prod:'',cli:'',gran:'mes'},
  ruta:'P001', scnEdit:'ef', compare:['base','ef','turno','hx','maq'], simTab:'esc',
  pedido:{cli:'',prod:'P001',cant:30000,unidad:'kg',fecha:'2026-10-31',forecast:false}, pedidoRes:null,
  mix:null, bnSel:'', demBase:'plan', importMsg:''};

function loadState(){
  try{ const s=localStorage.getItem(STORE_KEY); if(s){ const o=JSON.parse(s); DB=o.DB; CFG=o.CFG; SCN=o.SCN; } }catch(e){}
  if(!DB||!CFG||!SCN){ DB=structuredClone(DEMO.data); CFG=structuredClone(DEMO.cfg); SCN=structuredClone(DEMO.scenarios); }
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({DB,CFG,SCN})); }catch(e){} }
const months=()=>monthsFrom(CFG.mesInicio,CFG.horizonte);
const scnById=id=>SCN.find(s=>s.id===id);
function dbFor(s){ return (!s||s.id==='base') ? DB : Engine.applyScenario(DB,s,CFG); }

function recalc(){
  Engine.invalidate(DB);
  const db=dbFor(scnById(UI.scnActivo)); Engine.invalidate(db);
  const pot={cal:{}}; db.calendar.forEach(c=>pot.cal[c.proc]={turnos:Math.floor(24/(c.horasTurno||8)),horasExtra:c.maxHorasExtra});
  const dbPot=Engine.applyScenario(db,pot,CFG);
  R={db, bal:Engine.run(db,CFG), pref:Engine.run(db,{...CFG,politica:'preferente'}), pot:Engine.run(dbPot,CFG), capex:null, pres:null};
  if(!UI.mes || !months().includes(UI.mes)) UI.mes=months()[0];
  saveState();
}
function capexResults(){
  if(!R.capex) R.capex=DB.capex.map(a=>{ try{ return Engine.evalCapex(R.db,CFG,a,R.bal); }catch(e){ return {a,err:e.message}; } });
  return R.capex;
}

/* =====================================================================
   4. FORMATO Y COMPONENTES
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=0)=>(n==null||!isFinite(n))?'—':(+n).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(x,d=1)=>(x==null||!isFinite(x))?(x===Infinity?'∞':'—'):fmt(x*100,d)+' %';
const ton=(kg,d=1)=>kg==null?'—':fmt(kg/1000,d)+' t';
const mm=n=>n==null||!isFinite(n)?'—':'$ '+fmt(n/1e6,1)+' M';
const cop=n=>n==null||!isFinite(n)?'—':'$ '+fmt(n,0);
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const avg=a=>a.length?sum(a)/a.length:0;
const pName=id=>Engine.ix(R.db).proc[id]?.nombre||id;
const mProcs=m=>m.procesos.map(pName).join(' / ');
function sem(u){ const t=CFG.sem; if(u==null) return 'nd'; if(!isFinite(u)||u>t.rojo) return 'red'; if(u>=t.naranja) return 'orange'; if(u>=t.amarillo) return 'yellow'; return 'green'; }
const semTxt={red:'Excedido',orange:'Crítico',yellow:'Alerta',green:'Disponible',nd:'—'};
function ubar(u){ const c=sem(u); const w=Math.min(isFinite(u)?u:1.3,1.3)/1.3*100;
  return `<div class="ubar" title="${pct(u)}"><i class="bg-${c}" style="width:${w}%"></i><b style="left:${100/1.3}%"></b></div>`; }
const pill=(c,t)=>`<span class="pill p-${c}">${esc(t)}</span>`;
function kpi(l,v,s,c='',big=false){ return `<div class="kpi ${c?'k-'+c:''} ${big?'big':''}"><div class="kl">${l}</div><div class="kv">${v}</div>${s?`<div class="ks">${s}</div>`:''}</div>`; }
const curM=()=>R.bal.months.find(m=>m.ym===UI.mes)||R.bal.months[0];
function opts(list,sel,blank){ return (blank!=null?`<option value="">${blank}</option>`:'')+list.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(t)}</option>`).join(''); }
function inp(path,val,type='num',w){ const v=type==='pct'?(val==null||val===''?'':+(+val*100).toFixed(2)):(Array.isArray(val)?val.join('|'):(val??''));
  return `<input class="ed" data-edit="${path}:${type}" type="${type==='num'||type==='pct'?'number':'text'}" step="any" value="${esc(v)}" ${w?`style="width:${w}px"`:''}>`; }

/* ---------- Clasificación de restricciones y valor de la hora ---------- */
function classify(ym,id){
  const mb=R.bal.months.find(x=>x.ym===ym), mp=R.pref.months.find(x=>x.ym===ym);
  const rb=mb.mres.find(r=>r.id===id), rp=mp?.mres.find(r=>r.id===id); const t=CFG.sem;
  if(!rb) return {t:'—',c:'nd'};
  if(rb.util>t.rojo){ const pu=Math.max(...mb.pools.filter(p=>rb.m.procesos.includes(p.id)).map(p=>p.util));
    return pu>t.rojo?{t:'Estructural',c:'red',d:'El proceso completo supera su capacidad.'}:{t:'Por compatibilidad',c:'red',d:'El proceso tiene holgura, pero los productos solo pueden ir a esta máquina.'}; }
  if(rp && rp.util>t.rojo) return {t:'Por asignación',c:'orange',d:'Se satura con la máquina preferente; el balanceo la resuelve.'};
  if(rb.util>=t.naranja) return {t:'Próximo a saturación',c:'orange'};
  if(rb.util>=t.amarillo) return {t:'En alerta',c:'yellow'};
  return {t:'Con holgura',c:'green'};
}
function valorHora(m,id){
  const r=m.mres.find(x=>x.id===id); if(!r) return null;
  const rows=Object.keys(r.load.byProd).map(pid=>{ const kg=Engine.kgThrough(r,pid), h=r.load.byProd[pid].h, mc=kg*Engine.margin(R.db,pid);
    return {pid,p:Engine.ix(R.db).prod[pid],kg,h,mc,mph:h>0?mc/h:null,mkg:Engine.margin(R.db,pid)}; }).sort((a,b)=>b.mph-a.mph);
  const H=sum(rows,x=>x.h), MC=sum(rows,x=>x.mc);
  return {r,rows,prom:H>0?MC/H:null,marginal:rows.length?rows[rows.length-1].mph:null,mejor:rows[0]};
}

/* ---------- Alertas ---------- */
function buildAlerts(){
  const out=[], t=CFG.sem, ms=R.bal.months, m=curM();
  R.db.machines.forEach(mc=>{
    const red=ms.find(x=>{const r=x.mres.find(y=>y.id===mc.id);return r.load.h>0&&r.util>t.rojo;});
    if(red){ const r=red.mres.find(y=>y.id===mc.id); out.push({c:'red',o:0,txt:`${mc.id} (${mProcs(mc)}) alcanzará ${pct(r.util,0)} de utilización en ${lab(red.ym)}: requiere ${fmt(r.load.h-r.cap.disp)} h adicionales.`}); return; }
    const or=ms.find(x=>{const r=x.mres.find(y=>y.id===mc.id);return r.util>=t.naranja;});
    if(or){ const r=or.mres.find(y=>y.id===mc.id); out.push({c:'orange',o:1,txt:`${mc.id} (${mProcs(mc)}) llega a ${pct(r.util,0)} en ${lab(or.ym)}: quedan ${fmt(r.libre)} h libres.`}); }
  });
  m.mres.forEach(r=>{ if(r.cap.teor>0 && r.cap.disponibilidad<CFG.minDisponibilidad) out.push({c:'yellow',o:2,txt:`${r.id} tiene disponibilidad de ${pct(r.cap.disponibilidad,0)} en ${lab(m.ym)} (${fmt(r.cap.paros)} h de mantenimiento, limpieza y paradas).`}); });
  m.issues.forEach(i=>out.push({c:'red',o:0,txt:`${i.prod} paso ${i.seq} (${pName(i.proc)}): ${i.msg}. Esa demanda no se está cargando.`}));
  [...m.mres].filter(r=>r.cap.disp>0).sort((a,b)=>b.libre-a.libre).slice(0,3).forEach(r=>out.push({c:'green',o:3,txt:`Hay ${fmt(r.libre)} h disponibles en ${r.id} (${mProcs(r.m)}) en ${lab(m.ym)}.`}));
  return out.sort((a,b)=>a.o-b.o);
}
const ICON={red:'■',orange:'▲',yellow:'●',green:'✓'};
const alertHtml=a=>`<div class="al al-${a.c}"><span>${ICON[a.c]}</span><div>${esc(a.txt)}</div></div>`;

/* ---------- Gráficos ---------- */
const CH={}; let AFTER=[];
const COL={navy:'#17304d',blue:'#2a6fdb',sky:'#8fb6ea',grey:'#a9b4c2',green:'#1f8a4c',yellow:'#c79a00',orange:'#d9730d',red:'#c62828',ink:'#1b2633'};
const semCol=u=>({red:COL.red,orange:COL.orange,yellow:COL.yellow,green:COL.green,nd:COL.grey})[sem(u)];
function chart(id,cfg){ AFTER.push(()=>{ const el=document.getElementById(id); if(!el) return;
  if(!window.Chart){ el.outerHTML='<div class="nochart">Los gráficos requieren conexión a internet (Chart.js). Los cálculos y tablas funcionan sin conexión.</div>'; return; }
  if(CH[id]) CH[id].destroy();
  Chart.defaults.font.family="'Archivo', 'Segoe UI', sans-serif"; Chart.defaults.font.size=11; Chart.defaults.color='#4d5a69';
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}},cfg.options||{});
  CH[id]=new Chart(el,cfg); }); }
const canvas=(id,h=260)=>`<div class="chw" style="height:${h}px"><canvas id="${id}"></canvas></div>`;
const pctAxis={ticks:{callback:v=>v+' %'}};

/* =====================================================================
   5. VISTAS
   ===================================================================== */
function head(t,sub,extra=''){ return `<div class="vh"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div><div class="vh-x">${extra}</div></div>`; }
const monthSel=()=>`<label class="ctl">Mes <select data-ui="mes">${opts(months().map(y=>[y,lab(y)]),UI.mes)}</select></label>`;

/* ---------- 1. Resumen ejecutivo ---------- */
function vResumen(){
  const m=curM(), t=CFG.sem, bn=m.bn;
  const hDisp=sum(m.mres,r=>r.cap.disp), hReq=sum(m.mres,r=>r.load.h);
  const crit=m.mres.filter(r=>r.load.h>0&&r.util>=t.naranja);
  const free=m.capKg!=null?m.capKg-m.demKg:null;
  const pm=R.pot.months.find(x=>x.ym===m.ym), add=pm&&pm.capKg&&m.capKg?pm.capKg-m.capKg:null;
  const conf=sum(Object.entries(Engine.demandBy(R.db,m.ym,['Confirmado'])),e=>e[1]);
  const vh=bn?valorHora(m,bn.id):null, cl=bn?classify(m.ym,bn.id):null;
  const prodMes=[...new Set(DB.production.map(p=>p.mes))].sort().pop();
  const prodKg=sum(DB.production.filter(p=>p.mes===prodMes),p=>p.kg);
  const histKg=sum(DB.demand.filter(d=>d.mes===prodMes&&d.tipo==='Histórico'),d=>d.kg);
  const sr=R.bal.satRecurso, sp=R.bal.satProceso;
  const lostKg=sum(R.bal.months,x=>x.lost.kg), lostMg=sum(R.bal.months,x=>x.lost.margen), lostV=sum(R.bal.months,x=>x.lost.ventas);
  const reqH=sum(R.bal.months,x=>sum(x.mres,r=>Math.max(0,r.load.h-r.cap.disp)));
  const restr=new Set(); R.bal.months.forEach(x=>x.mres.forEach(r=>{if(r.load.h>0&&r.util>t.rojo) restr.add(r.id);}));
  const bnH=bn?bn.load.h:0;
  const cap=R.capex; const best=cap?cap.filter(c=>!c.err).sort((a,b)=>b.vpn-a.vpn)[0]:null;
  const u=m.maxU;
  const gauge=`<div class="gauge"><div class="gtrack">${[t.amarillo,t.naranja,t.rojo].map(v=>`<span style="left:${v/1.3*100}%"></span>`).join('')}<i class="bg-${sem(u)}" style="width:${Math.min(u,1.3)/1.3*100}%"></i></div><div class="gscale"><span>0</span><span style="left:${t.amarillo/1.3*100}%">${pct(t.amarillo,0)}</span><span style="left:${t.naranja/1.3*100}%">${pct(t.naranja,0)}</span><span style="left:${t.rojo/1.3*100}%">${pct(t.rojo,0)}</span></div></div>`;
  const ms=R.bal.months;
  chart('chCapDem',{type:'bar',data:{labels:ms.map(x=>lab(x.ym)),datasets:[
    {type:'line',label:'Capacidad efectiva (t)',data:ms.map(x=>x.capKg/1000),borderColor:COL.navy,backgroundColor:COL.navy,borderWidth:2,pointRadius:2,tension:.2},
    {label:'Demanda (t)',data:ms.map(x=>x.demKg/1000),backgroundColor:ms.map(x=>x.maxU>t.rojo?COL.red:x.maxU>=t.naranja?COL.orange:COL.sky)}]},
    options:{scales:{y:{beginAtZero:true,title:{display:true,text:'toneladas / mes'}}}}});
  const top=[...m.mres].filter(r=>r.load.h>0).sort((a,b)=>b.util-a.util).slice(0,10);
  chart('chTop',{type:'bar',data:{labels:top.map(r=>r.id),datasets:[{label:'Utilización',data:top.map(r=>r.util*100),backgroundColor:top.map(r=>semCol(r.util))}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{...pctAxis,beginAtZero:true,suggestedMax:110}}}});
  const al=buildAlerts();
  return head('Resumen ejecutivo',`Escenario ${esc(scnById(UI.scnActivo)?.nombre||'Base')} · capacidad expresada como throughput del mix demandado`,monthSel())+`
  <section class="hero">
    <div class="hero-l">
      <div class="hl">Recurso que limita la planta en ${lab(m.ym)}</div>
      <div class="hn">${bn?esc(bn.id):'—'} <small>${bn?esc(bn.m.nombre)+' · '+esc(mProcs(bn.m)):''}</small></div>
      ${gauge}
      <div class="hs">${bn?`Utilización ${pct(u)} · ${fmt(bn.load.h)} h requeridas de ${fmt(bn.cap.disp)} h disponibles · ${pill(cl.c,cl.t)}`:''}</div>
    </div>
    <div class="hero-r">
      <div><span>Valor promedio de la hora del cuello</span><b>${vh?cop(vh.prom):'—'}</b></div>
      <div><span>Valor marginal (producto menos rentable por hora)</span><b>${vh?cop(vh.marginal):'—'}</b></div>
      <div><span>Saturación proyectada · recurso</span><b class="${sr?'t-red':'t-green'}">${sr?lab(sr.ym)+' · '+sr.id:'Sin saturación en el horizonte'}</b></div>
      <div><span>Saturación proyectada · proceso</span><b class="${sp?'t-red':'t-green'}">${sp?lab(sp.ym)+' · '+pName(sp.id):'Sin saturación en el horizonte'}</b></div>
    </div>
  </section>
  <div class="grid g4">
    ${kpi('Capacidad efectiva',ton(m.capKg),'Toneladas/mes con el mix actual')}
    ${kpi('Demanda',ton(m.demKg),`Confirmado ${ton(conf)} · resto forecast`)}
    ${kpi('Utilización del recurso limitante',pct(u),`Promedio de la planta ${pct(hReq/hDisp)}`,sem(u))}
    ${kpi(free>=0?'Capacidad disponible':'Déficit de capacidad',ton(Math.abs(free)),free>=0?'Volumen adicional del mismo mix':'Demanda que no se puede producir',free>=0?'green':'red')}
    ${kpi('Horas disponibles',fmt(hDisp)+' h',`${m.mres.filter(r=>r.cap.disp>0).length} máquinas activas`)}
    ${kpi('Horas comprometidas',fmt(hReq)+' h',`Libres ${fmt(hDisp-hReq)} h en toda la planta`)}
    ${kpi('Recursos críticos',crit.length,crit.length?crit.map(r=>r.id).join(', '):`Ninguno ≥ ${pct(t.naranja,0)}`,crit.length?'orange':'green')}
    ${kpi('Capacidad adicional potencial',add!=null?'+'+ton(add):'—','Con 3 turnos y horas extra máximas en todos los procesos')}
  </div>
  <div class="grid g21">
    <div class="card"><h3>Capacidad efectiva vs demanda</h3>${canvas('chCapDem',280)}<p class="note">Barras en naranja o rojo: meses en que el recurso limitante supera ${pct(t.naranja,0)} o ${pct(t.rojo,0)}.</p></div>
    <div class="card"><h3>Alertas</h3><div class="alerts">${al.slice(0,10).map(alertHtml).join('')||'<p class="note">Sin alertas.</p>'}</div>${al.length>10?`<p class="note">${al.length-10} alertas más en Cuellos de botella.</p>`:''}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Utilización por máquina · ${lab(m.ym)}</h3>${canvas('chTop',280)}</div>
    <div class="card"><h3>Indicadores estratégicos · horizonte de ${CFG.horizonte} meses</h3>
      <table class="t kv">
        <tr><td>Producción real ${prodMes?lab(prodMes):''}</td><td class="num">${ton(prodKg)} <small>(${pct(histKg?prodKg/histKg:null,0)} de la demanda)</small></td></tr>
        <tr><td>Recursos con capacidad restringida (&gt;${pct(t.rojo,0)})</td><td class="num">${restr.size} ${restr.size?'<small>('+[...restr].join(', ')+')</small>':''}</td></tr>
        <tr><td>Horas del cuello en ${lab(m.ym)}</td><td class="num">${fmt(bnH)} h</td></tr>
        <tr><td>Capacidad adicional requerida</td><td class="num">${fmt(reqH)} h-máquina</td></tr>
        <tr><td>Volumen no atendible por capacidad</td><td class="num">${ton(lostKg)}</td></tr>
        <tr><td>Ventas potenciales perdidas</td><td class="num t-red">${mm(lostV)}</td></tr>
        <tr><td>Margen de contribución potencial perdido</td><td class="num t-red">${mm(lostMg)}</td></tr>
        <tr><td>Mejor alternativa de expansión (VPN)</td><td class="num">${best?esc(best.a.nombre):`<a data-act="calcCapex">Calcular</a>`}</td></tr>
        <tr><td>CAPEX y payback de esa alternativa</td><td class="num">${best?mm(best.a.inversion)+' · '+(best.payback==null?'no recupera':best.payback<0.01?'inmediato':fmt(best.payback,1)+' años'):'—'}</td></tr>
      </table></div>
  </div>`;
}

/* ---------- 2. Capacidad ---------- */
function prodFilterSet(){ const f=UI.f; if(!f.fam&&!f.prod&&!f.cli) return null;
  return new Set(R.db.products.filter(p=>(!f.fam||p.familia===f.fam)&&(!f.cli||p.cliente===f.cli)&&(!f.prod||p.id===f.prod)).map(p=>p.id)); }
function aggMachines(ms,set){
  const o={};
  ms.forEach(mo=>mo.mres.forEach(r=>{ const a=o[r.id]||(o[r.id]={r,m:r.m,teor:0,paros:0,extra:0,disp:0,h:0,hProc:0,hSetup:0,hRoll:0,kg:0,mc:0});
    a.teor+=r.cap.teor; a.paros+=r.cap.paros; a.extra+=r.cap.extra; a.disp+=r.cap.disp;
    const pids=Object.keys(r.load.byProd).filter(p=>!set||set.has(p));
    const hp=sum(pids,p=>r.load.byProd[p].h); a.h+=hp;
    const k=r.load.h>0?hp/r.load.h:0; a.hProc+=r.load.hProc*k; a.hSetup+=r.load.hSetup*k; a.hRoll+=r.load.hRoll*k;
    pids.forEach(p=>{ const kg=Engine.kgThrough(r,p); a.kg+=kg; a.mc+=kg*Engine.margin(R.db,p); }); }));
  return o;
}
function vCapacidad(){
  const f=UI.f, set=prodFilterSet();
  const ms = f.gran==='anio'? R.bal.months : [curM()];
  const agg=aggMachines(ms,set);
  const cal=Engine.ix(R.db).cal;
  const scale=m=>{ if(f.gran==='dia') return 1/(cal[m.procesos[0]]?.diasMes||26); if(f.gran==='semana') return 12/52; return 1; };
  const procs=R.db.processes.filter(p=>p.activo&&(!f.proc||p.id===f.proc));
  const unitLbl={dia:'día',semana:'semana',mes:'mes',anio:'año'}[f.gran];
  let rows='';
  procs.forEach(p=>{
    const mlist=R.db.machines.filter(m=>m.procesos.includes(p.id)&&(!f.maq||m.id===f.maq)); if(!mlist.length) return;
    const A=mlist.map(m=>agg[m.id]); const sc=scale(mlist[0]);
    const disp=sum(A,a=>a.disp)*sc, h=sum(A,a=>a.h)*sc, u=disp>0?h/disp:null;
    const shared=mlist.some(m=>m.procesos.length>1);
    rows+=`<tr class="grp"><td colspan="2">${esc(p.nombre)} <small>${p.unidad==='golpe'?'golpes/min':'m/min'}${shared?' · máquinas compartidas con otro proceso: la carga incluye ambos':''}</small></td>
      <td class="num">${fmt(sum(A,a=>a.teor)*sc)}</td><td class="num">${fmt(sum(A,a=>a.paros)*sc)}</td><td class="num">${fmt(disp)}</td><td class="num">${fmt(h)}</td><td></td><td class="num ${disp-h<0?'t-red':''}">${fmt(disp-h)}</td><td>${ubar(u)}</td><td class="num">${pct(u)}</td><td></td><td></td></tr>`;
    mlist.forEach(m=>{ const a=agg[m.id], s=scale(m), uu=a.disp>0?a.h/a.disp:(a.h>0?Infinity:null);
      const capKg=a.h>0?a.kg/a.h*a.disp:null;
      rows+=`<tr><td class="ind"><b>${m.id}</b> ${esc(m.nombre)}</td><td>${fmt(m.velocidad)} ${p.unidad==='golpe'?'g/min':'m/min'}</td>
        <td class="num">${fmt(a.teor*s)}</td><td class="num">${fmt(a.paros*s)}</td><td class="num">${fmt(a.disp*s)}</td><td class="num">${fmt(a.h*s)}</td>
        <td class="num sm">${fmt(a.hProc*s)} / ${fmt(a.hSetup*s)} / ${fmt(a.hRoll*s)}</td>
        <td class="num ${a.disp-a.h<0?'t-red':''}">${fmt((a.disp-a.h)*s)}</td><td>${ubar(uu)}</td><td class="num">${pct(uu)}</td>
        <td class="num">${capKg!=null?ton(capKg*s):'—'}</td><td class="num">${a.h>0?cop(a.mc/a.h):'—'}</td></tr>`; });
  });
  const ML=R.db.machines.filter(m=>(!f.proc||m.procesos.includes(f.proc))&&(!f.maq||m.id===f.maq));
  chart('chHrs',{type:'bar',data:{labels:ML.map(m=>m.id),datasets:[
    {label:'Horas disponibles',data:ML.map(m=>agg[m.id].disp*scale(m)),backgroundColor:'#c9d6e6'},
    {label:'Horas requeridas',data:ML.map(m=>agg[m.id].h*scale(m)),backgroundColor:ML.map(m=>semCol(agg[m.id].disp>0?agg[m.id].h/agg[m.id].disp:Infinity))}]},
    options:{scales:{y:{beginAtZero:true,title:{display:true,text:'horas / '+unitLbl}}}}});
  const pools=procs.map(p=>{const ml=R.db.machines.filter(m=>m.procesos.includes(p.id)); const d=sum(ml,m=>agg[m.id].disp), h=sum(ml,m=>agg[m.id].h); return {p,u:d>0?h/d:0};});
  chart('chProc',{type:'bar',data:{labels:pools.map(x=>x.p.nombre),datasets:[{label:'Utilización del proceso',data:pools.map(x=>x.u*100),backgroundColor:pools.map(x=>semCol(x.u))}]},
    options:{plugins:{legend:{display:false}},scales:{y:{...pctAxis,beginAtZero:true,suggestedMax:110}}}});
  const P=R.db.products, fams=[...new Set(P.map(p=>p.familia))];
  const filt=`<div class="filters">
    ${f.gran!=='anio'?monthSel():''}
    <label class="ctl">Vista <select data-ui="f.gran">${opts([['dia','Día'],['semana','Semana'],['mes','Mes'],['anio','Año (horizonte)']],f.gran)}</select></label>
    <label class="ctl">Proceso <select data-ui="f.proc">${opts(R.db.processes.map(p=>[p.id,p.nombre]),f.proc,'Todos')}</select></label>
    <label class="ctl">Máquina <select data-ui="f.maq">${opts(R.db.machines.filter(m=>!f.proc||m.procesos.includes(f.proc)).map(m=>[m.id,m.id]),f.maq,'Todas')}</select></label>
    <label class="ctl">Familia <select data-ui="f.fam">${opts(fams.map(x=>[x,x]),f.fam,'Todas')}</select></label>
    <label class="ctl">Cliente <select data-ui="f.cli">${opts(R.db.customers.map(c=>[c.id,c.nombre]),f.cli,'Todos')}</select></label>
    <label class="ctl">Producto <select data-ui="f.prod">${opts(P.map(p=>[p.id,p.id+' '+p.descripcion]),f.prod,'Todos')}</select></label>
  </div>`;
  return head('Capacidad','Horas disponibles frente a horas requeridas por proceso y máquina')+filt+
  (set?`<div class="banner">Filtro de demanda activo: las horas requeridas muestran solo la carga de ${set.size} producto(s); la capacidad sigue siendo la total de cada máquina.</div>`:'')+
  `<div class="card"><div class="tw"><table class="t">
    <thead><tr><th>Proceso / máquina</th><th>Velocidad</th><th class="num">H teóricas</th><th class="num">Paros</th><th class="num">H disponibles</th><th class="num">H requeridas</th><th class="num">Proceso / setup / rollos</th><th class="num">H libres</th><th>Utilización</th><th class="num"></th><th class="num">Cap. efectiva (mix)</th><th class="num">Margen / h</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="note">Paros = mantenimiento presupuestado + limpiezas + paradas no programadas. Capacidad efectiva en toneladas de producto terminado según el mix que pasa por cada máquina. Por ${unitLbl}.</p></div>
  <div class="grid g2"><div class="card"><h3>Horas disponibles vs requeridas</h3>${canvas('chHrs',300)}</div><div class="card"><h3>Utilización por proceso</h3>${canvas('chProc',300)}</div></div>`;
}

/* ---------- 3. Demanda ---------- */
function vDemanda(){
  const t=CFG.sem, ms=R.bal.months;
  if(UI.demBase==='pres' && !R.pres) R.pres=Engine.run(R.db,{...CFG,tiposDemanda:['Presupuesto']});
  const run=UI.demBase==='pres'?R.pres:R.bal;
  const dsum=(ym,tp)=>sum(R.db.demand.filter(d=>d.mes===ym&&d.tipo===tp),d=>+d.kg);
  const hist=[...new Set(DB.demand.filter(d=>d.tipo==='Histórico').map(d=>d.mes))].sort();
  let rows=hist.map(ym=>{ const h=dsum(ym,'Histórico'), p=sum(DB.production.filter(x=>x.mes===ym),x=>x.kg);
    return `<tr class="hist"><td>${lab(ym)}</td><td colspan="2" class="note">Histórico</td><td class="num">${ton(h)}</td><td class="num">—</td><td class="num">${ton(p)} <small>producido</small></td><td class="num">${pct(h?p/h:null,0)} <small>cumpl.</small></td><td></td></tr>`; }).join('');
  rows+=run.months.map(m=>{ const c=dsum(m.ym,'Confirmado'), fc=dsum(m.ym,'Forecast'), pr=dsum(m.ym,'Presupuesto'); const gap=m.capKg!=null?m.capKg-m.demKg:null;
    return `<tr class="${m.maxU>t.rojo?'row-red':''}"><td><b>${lab(m.ym)}</b></td><td class="num">${ton(c)}</td><td class="num">${ton(fc)}</td><td class="num"><b>${ton(m.demKg)}</b></td><td class="num">${ton(pr)}</td><td class="num">${ton(m.capKg)}</td>
      <td class="num">${pill(sem(m.maxU),pct(m.maxU,0))}</td><td class="num ${gap<0?'t-red':'t-green'}"><b>${gap==null?'—':(gap>=0?'+':'−')+ton(Math.abs(gap))}</b>${m.lost.kg>0?`<br><small>no atendible ${ton(m.lost.kg)}</small>`:''}</td></tr>`; }).join('');
  // Curva de saturación
  const m=curM(); const fx=[]; for(let k=70;k<=150;k+=5) fx.push(k);
  const demBase=Engine.demandBy(R.db,m.ym,CFG.tiposDemanda);
  const curve=fx.map(k=>{ const d={}; for(const p in demBase) d[p]=demBase[p]*k/100; const r=Engine.runMonth(R.db,CFG,m.ym,{demand:d}); return {k,u:r.maxU,bn:r.bn?.id}; });
  const satK=curve.find(c=>c.u>t.rojo);
  chart('chDem',{type:'bar',data:{labels:run.months.map(x=>lab(x.ym)),datasets:[
    {type:'line',label:'Capacidad efectiva',data:run.months.map(x=>x.capKg/1000),borderColor:COL.navy,borderWidth:2,pointRadius:2},
    {type:'line',label:'Presupuesto',data:run.months.map(x=>dsum(x.ym,'Presupuesto')/1000),borderColor:COL.grey,borderDash:[4,4],borderWidth:1.5,pointRadius:0},
    {label:'Confirmado',data:run.months.map(x=>dsum(x.ym,'Confirmado')/1000),backgroundColor:COL.navy+'cc',stack:'d'},
    {label:'Forecast',data:run.months.map(x=>dsum(x.ym,'Forecast')/1000),backgroundColor:COL.sky,stack:'d'}]},
    options:{scales:{x:{stacked:true},y:{stacked:false,beginAtZero:true,title:{display:true,text:'toneladas'}}}}});
  chart('chSat',{type:'line',data:{labels:curve.map(c=>c.k+' %'),datasets:[
    {label:'Utilización del recurso limitante',data:curve.map(c=>c.u*100),borderColor:COL.blue,backgroundColor:COL.blue,pointRadius:3,
      pointBackgroundColor:curve.map(c=>semCol(c.u))},
    {label:'Límite',data:curve.map(()=>t.rojo*100),borderColor:COL.red,borderDash:[5,4],pointRadius:0,borderWidth:1}]},
    options:{scales:{y:{...pctAxis},x:{title:{display:true,text:'Demanda de '+lab(m.ym)+' (100 % = plan actual)'}}},
      plugins:{tooltip:{callbacks:{afterLabel:c=>c.datasetIndex===0?'Cuello: '+curve[c.dataIndex].bn:''}}}}});
  chart('chEvo',{type:'line',data:{labels:ms.map(x=>lab(x.ym)),datasets:R.db.processes.filter(p=>p.activo).map((p,i)=>({label:p.nombre,data:ms.map(x=>x.pools.find(q=>q.id===p.id).util*100),borderWidth:1.6,pointRadius:0,
    borderColor:['#17304d','#2a6fdb','#c62828','#7a8ea6','#1f8a4c','#d9730d','#8a5cc2','#c79a00','#3fa7a3'][i%9]}))},options:{scales:{y:pctAxis}}});
  return head('Demanda','Plan mensual frente a capacidad efectiva, con el déficit visible mes a mes',
    `<label class="ctl">Demanda base <select data-ui="demBase">${opts([['plan','Plan (confirmado + forecast)'],['pres','Presupuesto']],UI.demBase)}</select></label>`)+`
  <div class="card"><div class="tw"><table class="t">
    <thead><tr><th>Mes</th><th class="num">Confirmado</th><th class="num">Forecast</th><th class="num">Demanda</th><th class="num">Presupuesto</th><th class="num">Capacidad</th><th class="num">Utilización</th><th class="num">Gap</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="note">${UI.demBase==='pres'?'Capacidad y utilización calculadas con la demanda de presupuesto.':'Capacidad y utilización calculadas con confirmado + forecast.'} La capacidad en toneladas depende del mix de cada mes: si el mix cambia, cambia la capacidad.</p></div>
  <div class="grid g2">
    <div class="card"><h3>Demanda por tipo vs capacidad</h3>${canvas('chDem',290)}</div>
    <div class="card"><h3>Curva de saturación · ${lab(m.ym)}</h3>${canvas('chSat',250)}

/* ---------- 6. Productos / Mix ---------- */
function vProductos(){
  const m=curM(); const P=DB.products;
  const rows=P.map(p=>{ const k=`products:${p.id}`, g=Engine.gramaje(p), mg=DB.margins.find(x=>x.prod===p.id)||{};
    return `<tr><td><b>${p.id}</b></td><td>${inp(k+':descripcion',p.descripcion,'text',170)}</td><td>${inp(k+':familia',p.familia,'text',90)}</td>
      <td><select class="ed" data-edit="${k}:cliente:text">${opts(DB.customers.map(c=>[c.id,c.nombre]),p.cliente)}</select></td>
      <td class="sm">${p.estructura.map(l=>`${esc(l.material)} ${l.micras}µ`).join(' / ')}</td><td class="num">${fmt(g,1)}</td>
      <td>${inp(k+':anchoWeb',p.anchoWeb,'num',62)}</td><td>${inp(k+':pistas',p.pistas,'num',50)}</td><td>${inp(k+':largo',p.largo,'num',56)}</td><td>${inp(k+':gramajeAdic',p.gramajeAdic,'num',50)}</td>
      <td>${inp(k+':loteKg',p.loteKg,'num',70)}</td><td>${inp('margins:'+p.id+':margenKg',mg.margenKg,'num',70)}</td><td>${inp('margins:'+p.id+':precioKg',mg.precioKg,'num',76)}</td>
      <td><select class="ed" data-edit="${k}:estado:text">${opts([['Activo','Activo'],['Inactivo','Inactivo']],p.estado)}</select></td></tr>`; }).join('');
  // Mix
  const dem=Engine.demandBy(R.db,m.ym,CFG.tiposDemanda); const T=sum(Object.values(dem));
  if(!UI.mix||UI.mix.ym!==m.ym){ UI.mix={ym:m.ym,sh:{}}; P.forEach(p=>UI.mix.sh[p.id]=+(100*(dem[p.id]||0)/T).toFixed(1)); }
  const sh=UI.mix.sh, st=sum(Object.values(sh),x=>+x||0);
  const nd={}; P.forEach(p=>nd[p.id]=T*(+sh[p.id]||0)/(st||1));
  const r0=m, r1=Engine.runMonth(R.db,CFG,m.ym,{demand:nd});
  const mixRows=P.map(p=>`<tr><td><b>${p.id}</b> ${esc(p.descripcion)}</td><td class="num">${pct((dem[p.id]||0)/T)}</td><td><input type="number" step="0.5" data-mix="${p.id}" value="${sh[p.id]}" style="width:70px"></td><td class="num">${ton(nd[p.id])}</td><td class="num">${cop(Engine.margin(R.db,p.id))}</td></tr>`).join('');
  const cmp=(l,a,b,f,good)=>`<tr><td>${l}</td><td class="num">${f(a)}</td><td class="num">${f(b)}</td><td class="num ${good==null?'':((b-a)*(good?1:-1)>0?'t-green':(b-a)!==0?'t-red':'')}">${typeof a==='number'&&typeof b==='number'?((b-a>=0?'+':'')+f(b-a)):''}</td></tr>`;
  const procs=R.db.processes.filter(p=>p.activo);
  chart('chMix',{type:'bar',data:{labels:procs.map(p=>p.nombre),datasets:[
    {label:'Mix actual',data:procs.map(p=>r0.pools.find(x=>x.id===p.id).util*100),backgroundColor:'#9db3cc'},
    {label:'Nuevo mix',data:procs.map(p=>r1.pools.find(x=>x.id===p.id).util*100),backgroundColor:COL.blue}]},options:{scales:{y:{...pctAxis,beginAtZero:true}}}});
  return head('Productos y mix','Referencias, estructura y economía por kg. Abajo: impacto de un cambio de mix sobre el cuello de botella.',monthSel())+`
  <div class="card"><div class="tw"><table class="t ed-t"><thead><tr><th>Código</th><th>Descripción</th><th>Familia</th><th>Cliente</th><th>Estructura</th><th class="num">g/m²</th><th>Ancho web (m)</th><th>Pistas</th><th>Avance/largo (m)</th><th>Tintas+adh. g/m²</th><th>Lote prom. kg</th><th>MC $/kg</th><th>Precio $/kg</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Gramaje = Σ(micras × densidad) + tintas y adhesivos. Pistas = rollos angostos que salen del refile de impreso; los pasos posteriores procesan esos metros multiplicados. Avance/largo = metros por golpe en Corte. Lote promedio = kg por cambio de referencia (define el número de setups). MC incluye arancel; no incluye fletes ni comisiones.</p></div>
  <div class="grid g12">
    <div class="card"><h3>Nuevo mix · ${lab(m.ym)} · mismo volumen total (${ton(T)})</h3>
      <table class="t"><thead><tr><th>Producto</th><th class="num">Actual</th><th>Nuevo %</th><th class="num">Volumen</th><th class="num">MC/kg</th></tr></thead><tbody>${mixRows}</tbody></table>
      <p class="note">Suma: ${fmt(st,1)} % ${Math.abs(st-100)>0.5?'(se normaliza a 100 %)':''}. <a data-act="mixReset">Restablecer</a></p></div>
    <div class="card"><h3>Impacto del cambio de mix</h3>
      <table class="t"><thead><tr><th></th><th class="num">Actual</th><th class="num">Nuevo</th><th class="num">Δ</th></tr></thead><tbody>
      ${cmp('Cuello de botella',r0.bn?.id+' · '+pct(r0.maxU,0),r1.bn?.id+' · '+pct(r1.maxU,0),x=>x)}
      ${cmp('Capacidad efectiva (t)',r0.capKg/1000,r1.capKg/1000,x=>fmt(x,1),true)}
      ${cmp('Capacidad disponible (t)',(r0.capKg-r0.demKg)/1000,(r1.capKg-r1.demKg)/1000,x=>fmt(x,1),true)}
      ${cmp('Horas requeridas',sum(r0.mres,x=>x.load.h),sum(r1.mres,x=>x.load.h),x=>fmt(x),false)}
      ${cmp('Margen total ($ M)',r0.margen/1e6,r1.margen/1e6,x=>fmt(x,1),true)}
      ${cmp('Margen atendible ($ M)',(r0.margen-r0.lost.margen)/1e6,(r1.margen-r1.lost.margen)/1e6,x=>fmt(x,1),true)}
      </tbody></table>${canvas('chMix',230)}</div>
  </div>`;
}

  const fs=Engine.factors(db,p);

    const cands=db.machines.filter(m=>m.procesos.includes(s.proc));
    const mcell=cands.map(m=>{ const on=s.maquinas.includes(m.id); const rs=Engine.reasons(db,p,f,m);
      const hk=on&&!rs.length? (Engine.perKg(db,CFG,p,f,m)): null;
      return `<label class="mc ${on?(rs.length?'bad':'on'):''}" title="${esc(rs.join('; ')||'Compatible')}"><input type="checkbox" data-step="${p.id}#${s.seq}" data-m="${m.id}" ${on?'checked':''}> ${m.id}${hk?` <small>${fmt((hk.hProc+hk.hRoll)*1000,1)} h/t</small>`:''}${on&&rs.length?' <small>⚠</small>':''}</label>`; }).join('');

      <td class="num">${fmt(f.mPerKg,1)} m/kg${pr?.unidad==='golpe'?`<br><small>${fmt(f.mPerKg/(p.largo||0.25),1)} golpes/kg</small>`:''}</td><td class="num">${fmt(f.calibre,0)} µ</td><td class="num">${fmt(f.anchoMm,0)} mm</td>
      <td class="nowrap"><button class="xb" data-act="stepUp" data-k="${p.id}#${s.seq}" ${i===0?'disabled':''}>↑</button><button class="xb" data-act="stepDel" data-k="${p.id}#${s.seq}">×</button></td></tr>`; }).join('');
  const kg=1000; const m=curM();
  const sumH=fs.map(f=>{ const op=Engine.options(db,CFG,p,f,kg); return {f,op}; });
  return head('Rutas productivas','Cada referencia define su secuencia de procesos y sus máquinas compatibles',
    `<label class="ctl">Producto <select data-ui="ruta">${opts(db.products.map(q=>[q.id,q.id+' '+q.descripcion]),p.id)}</select></label>`)+`
  <div class="card"><div class="route-flow">${fs.map(f=>`<span>${esc(x.proc[f.step.proc]?.nombre||f.step.proc)}</span>`).join('<i>→</i>')}</div>
    <p class="note">${esc(p.familia)} · ${esc(x.cust[p.cliente]?.nombre||'')} · ${p.estructura.map(l=>`${esc(l.material)} ${l.micras} µ (entra en paso ${l.paso})`).join(' + ')} · gramaje ${fmt(Engine.gramaje(p),1)} g/m² · ancho ${fmt(p.anchoWeb*1000,0)} mm · ${p.pistas} pista(s)</p>
    <div class="tw"><table class="t ed-t"><thead><tr><th class="num">Paso</th><th>Proceso</th><th>Máquinas compatibles (h por tonelada)</th><th>Eficiencia %</th><th>Rendimiento %</th><th>Setup h (vacío = estándar)</th><th>% del volumen que pasa</th><th class="num">Metros</th><th class="num">Calibre</th><th class="num">Ancho</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

/* ---------- 8. Simulador ---------- */
function scnSummary(run){ const ms=run.months, t=CFG.sem; const peak=[...ms].sort((a,b)=>b.maxU-a.maxU)[0];
  return {capT:avg(ms.map(m=>m.capKg||0)), demT:avg(ms.map(m=>m.demKg)), peakU:peak.maxU, peakBn:peak.bn?.id, peakYm:peak.ym,
    deficit:ms.filter(m=>m.maxU>t.rojo).length, lostKg:sum(ms,m=>m.lost.kg), lostMg:sum(ms,m=>m.lost.margen),
    mgAt:sum(ms,m=>m.margen-m.lost.margen), hDisp:sum(ms,m=>sum(m.mres,r=>r.cap.disp)), hReq:sum(ms,m=>sum(m.mres,r=>r.load.h)), sat:run.satRecurso}; }
function vSimulador(){
  const tabs=`<div class="tabs"><a class="${UI.simTab==='esc'?'on':''}" data-act="simTab" data-t="esc">Escenarios</a><a class="${UI.simTab==='ped'?'on':''}" data-act="simTab" data-t="ped">Analizar nuevo pedido</a></div>`;
  return head('Simulador','Escenarios de capacidad y evaluación de pedidos')+tabs+(UI.simTab==='ped'?vPedido():vEscenarios());
}
function vEscenarios(){
  const s=scnById(UI.scnEdit)||SCN[0]; const ed=!s.fijo;
  const runs=UI.compare.map(id=>scnById(id)).filter(Boolean).map(sc=>{ const db=dbFor(sc); Engine.invalidate(db); const r=Engine.run(db,CFG); return {sc,r,s:scnSummary(r)}; });
  const base=runs.find(x=>x.sc.id==='base')||runs[0];
  const calRows=DB.calendar.map(c=>{ const v=(s.cal&&s.cal[c.proc])||{};
    return `<tr><td>${pName(c.proc)}</td>${['turnos','horasTurno','diasMes','horasExtra'].map(k=>`<td><input type="number" step="any" ${ed?'':'disabled'} data-scn="cal:${c.proc}:${k}" value="${v[k]??''}" placeholder="${c[k]}" style="width:62px"></td>`).join('')}</tr>`; }).join('');
